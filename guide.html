<style>
*{box-sizing:border-box}body{margin:0;padding:20px 16px 40px;color:#1a1a1a;background:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.wrap{max-width:480px;margin:0 auto}h1{font-size:21px;margin:6px 0 4px;font-weight:800}.sub{font-size:13px;color:#777;margin-bottom:14px;line-height:1.6}.level-switch,.ind-switch{display:flex;gap:6px;margin-bottom:14px}.level-switch button,.ind-switch button{flex:1;border-radius:10px;cursor:pointer}.level-switch button{font-size:12.5px;font-weight:600;padding:9px 8px;border:1.5px solid #e2e6eb;background:#f7f7f9;color:#888}.level-switch button.active{background:#eef4ff;border-color:#7ba9ff;color:#1a4fb0}.ind-switch button{font-size:12.5px;font-weight:700;padding:11px 6px;border:1.5px solid #e2e6eb;background:#fff;color:#555}.ind-switch button.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}section{border:1px solid #eee;border-radius:14px;padding:16px;margin-bottom:12px}section h2{font-size:15.5px;margin:0 0 10px}section p{font-size:13.5px;line-height:1.8;color:#333;margin:0}.ind-section{display:none}body.ind-macd .ind-macd,body.ind-rsi .ind-rsi,body.ind-volume .ind-volume{display:block}.lvl-eli5{display:none}body.eli5 .lvl-eli5{display:block}body.eli5 .lvl-normal{display:none}.combo{background:#fbfaf5}.nav{margin-top:20px;font-size:12.5px;display:flex;justify-content:space-between}.nav a{color:#1264a3;text-decoration:none}.i18n-switch{display:flex;gap:4px;justify-content:flex-end;margin-bottom:8px}.i18n-switch button{font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid #e2e6eb;background:#f7f7f9;color:#888;cursor:pointer}.i18n-switch button.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}.disclaimer{display:flex;align-items:flex-start;gap:8px;margin:4px 0 14px;padding:11px 13px;border-radius:12px;background:#fff8e1;border:1.5px solid #ffd54f;color:#7a5c00;font-size:12.5px;font-weight:700;line-height:1.5}.visual{margin:2px 0 14px;border:1px solid #e9edf2;border-radius:13px;overflow:hidden;background:linear-gradient(180deg,#fbfcfe,#f6f8fb)}.visual svg{display:block;width:100%;height:auto}.visual-note{display:flex;align-items:center;gap:7px;padding:9px 11px;border-top:1px solid #e9edf2;background:#fff;font-size:12px;font-weight:700;color:#344054}.dot{width:8px;height:8px;border-radius:50%;background:#20a464;box-shadow:0 0 0 4px #dff5ea;flex:0 0 auto}.axis{stroke:#d9dee7;stroke-width:1}.grid{stroke:#edf0f4;stroke-width:1;stroke-dasharray:4 4}.signal-zone{fill:#eaf8f0}.warn-zone{fill:#fff3f1}.macd-line{fill:none;stroke:#1677ff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.sig-line{fill:none;stroke:#ff8a34;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.rsi-line{fill:none;stroke:#7b61ff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.avg-line{stroke:#8b95a5;stroke-width:2;stroke-dasharray:5 4}.bar{fill:#c8d0dc}.bar-hot{fill:#20a464}.hist-neg{fill:#f2b7ad}.hist-pos{fill:#95d9b5}.marker{fill:#20a464;stroke:#fff;stroke-width:3}.label{font:700 10px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#667085}.label-strong{font:800 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#147a4d}@media(max-width:390px){.ind-switch button{font-size:11.5px;padding-left:3px;padding-right:3px}}

<section class="ind-section ind-macd"><h2 data-i18n="macd_title"></h2>
<div class="visual"><svg viewBox="0 0 420 190" role="img" aria-label="MACD crossover diagram"><line class="grid" x1="30" y1="90" x2="395" y2="90"/><text class="label" x="32" y="82">0</text><rect class="hist-neg" x="55" y="91" width="18" height="22" rx="3"/><rect class="hist-neg" x="82" y="91" width="18" height="16" rx="3"/><rect class="hist-neg" x="109" y="91" width="18" height="10" rx="3"/><rect class="hist-neg" x="136" y="91" width="18" height="5" rx="3"/><rect class="hist-pos" x="163" y="82" width="18" height="8" rx="3"/><rect class="hist-pos" x="190" y="75" width="18" height="15" rx="3"/><rect class="hist-pos" x="217" y="68" width="18" height="22" rx="3"/><path class="sig-line" d="M42 64 C92 50,130 54,166 63 S237 75,286 67 S350 55,390 49"/><path class="macd-line" d="M42 49 C88 56,127 70,166 65 S233 50,286 45 S349 40,390 31"/><circle class="marker" cx="166" cy="64" r="6"/><text class="label-strong" x="177" y="54">CROSS ↑</text><text class="label" x="302" y="28">MACD</text><text class="label" x="302" y="67">SIGNAL</text></svg><div class="visual-note"><span class="dot"></span><span data-i18n="macd_visual"></span></div></div>

<p class="lvl-normal" data-i18n="volume_normal"></p><p class="lvl-eli5" data-i18n="volume_eli5"></p></section>

<script>
(function(){var LK='sa_level',IK='sa_indicator',lbs=document.querySelectorAll('.level-switch button'),ibs=document.querySelectorAll('.ind-switch button'),inds=['macd','rsi','volume'];function level(v){document.body.classList.toggle('eli5',v==='eli5');lbs.forEach(b=>b.classList.toggle('active',b.dataset.level===v));try{localStorage.setItem(LK,v)}catch(e){}}function ind(v){inds.forEach(i=>document.body.classList.toggle('ind-'+i,i===v));ibs.forEach(b=>b.classList.toggle('active',b.dataset.ind===v));try{localStorage.setItem(IK,v)}catch(e){}}lbs.forEach(b=>b.onclick=()=>level(b.dataset.level));ibs.forEach(b=>b.onclick=()=>ind(b.dataset.ind));var l='normal',i='macd';try{l=localStorage.getItem(LK)||l;i=localStorage.getItem(IK)||i}catch(e){}level(l);ind(i)})();
</script>
<script>
(function(){
var D={
ko:{page_title:'매수 신호 지표 쉽게 알아보기',h1:'이 신호, 어떻게 나온 거예요?',sub:'대시보드가 매수 신호를 판단할 때 실제로 쓰는 3가지 지표예요. 그림으로 먼저 보고, 설명을 읽어보세요.',level_normal:'🎓 일반 설명',level_eli5:'🧒 초등학생도 이해하는 설명',macd_tab:'① MACD 크로스',rsi_tab:'② RSI 반등',volume_tab:'③ 거래량 급증',macd_title:'① MACD 크로스 — 추세 전환',macd_visual:'파란 MACD선이 주황 시그널선을 아래에서 위로 넘고, 히스토그램이 +로 바뀌는 순간',macd_normal:'MACD는 단기 흐름과 장기 흐름의 차이를 보는 지표예요. MACD선이 시그널선을 아래에서 위로 돌파하고 히스토그램이 음수에서 양수로 바뀌면 최근 가격 흐름이 상승 쪽으로 전환되는 신호로 봅니다. 다만 MACD는 후행지표라 실제 바닥보다 늦게 신호가 나올 수 있어 RSI와 거래량을 함께 확인합니다.',macd_eli5:'두 친구가 달리기를 하는데, 뒤에 있던 빠른 친구가 앞 친구를 딱 추월하는 순간을 생각해봐요. 그 순간이 MACD 크로스예요. 흐름이 바뀌기 시작했다는 뜻이지만 조금 늦게 알려줄 수 있어서 다른 신호도 같이 봐요.',rsi_title:'② RSI 반등 — 너무 많이 떨어졌다가 돌아오기',rsi_visual:'RSI가 30 아래까지 내려간 뒤 다시 30 위로 올라오는 순간',rsi_normal:'RSI는 0~100 사이 숫자로 최근 주식이 과하게 팔렸는지 또는 과하게 샀는지를 보여줘요. 보통 30 이하는 과매도, 70 이상은 과매수로 봅니다. 이 대시보드는 RSI가 30 이하까지 내려갔다가 다시 30 위로 올라오는 순간을 회복 신호로 봅니다. 다만 강한 하락장에서는 RSI가 오랫동안 30 아래에 머물 수 있어 단독으로 사용하지 않습니다.',rsi_eli5:'고무줄을 너무 세게 늘렸다가 다시 조금씩 돌아오는 모습을 생각해봐요. RSI가 30 아래까지 내려갔다가 다시 올라오면 “이제 다시 튕겨 올라오려나?” 하고 보는 거예요.',volume_title:'③ 거래량 급증 — 사람들이 갑자기 몰릴 때',volume_visual:'오늘 거래량이 최근 20일 평균보다 1.5배 이상 커지는 순간',volume_normal:'거래량은 하루 동안 얼마나 많이 사고팔렸는지를 보여줘요. 이 대시보드는 오늘 거래량을 최근 20일 평균과 비교해 기본 1.5배 이상이면 거래량 급증으로 판단합니다. 많은 참여자가 실제로 들어왔는지 확인하는 검증 역할이라 MACD와 RSI 신호의 신뢰도를 높여줍니다.',volume_eli5:'평소 한산하던 매점에 갑자기 친구들이 우르르 몰려오는 것과 같아요. 평소보다 사람이 훨씬 많아졌다면 “무슨 일이 있구나!”라고 볼 수 있죠.',combo_title:'그럼 왜 3개를 같이 봐요?',combo_normal:'MACD는 추세 전환, RSI는 과매도 회복, 거래량은 실제 참여 증가를 각각 확인합니다. 서로 성격이 다른 세 신호가 최근 몇 봉 안에 함께 나타나면 한 가지 지표만 볼 때보다 거짓 신호를 줄일 수 있습니다.',combo_eli5:'친구 한 명 말보다 서로 다른 세 친구가 모두 “이거 진짜 같아!”라고 말하면 더 믿을 만한 것과 같아요.',back_home:'← 대시보드 홈',back_table:'실제 신호 보러 가기 →',disclaimer:'투자 판단은 본인 책임입니다. 참고용 지표일 뿐 매수·매도 추천이 아닙니다.'},
ja:{page_title:'買いシグナルの指標をやさしく解説',h1:'このシグナル、どうやって出るの？',sub:'ダッシュボードで使う3つの指標を、まず図で直感的に確認できます。',level_normal:'🎓 通常の説明',level_eli5:'🧒 小学生でもわかる説明',macd_tab:'① MACDクロス',rsi_tab:'② RSI反発',volume_tab:'③ 出来高急増',macd_title:'① MACDクロス — トレンド転換',macd_visual:'青いMACD線がオレンジのシグナル線を下から上へ抜け、ヒストグラムがプラスへ変わる瞬間',macd_normal:'MACDは短期と長期の値動きの差を見る指標です。MACD線がシグナル線を下から上へ抜け、ヒストグラムがマイナスからプラスに変わると、上昇方向への転換サインとみなします。ただし遅行指標なのでRSIと出来高も一緒に確認します。',macd_eli5:'後ろを走っていた速い友だちが、前の友だちを追い抜く瞬間を想像してください。それがMACDクロスです。流れが変わり始めた合図です。',rsi_title:'② RSI反発 — 売られすぎからの回復',rsi_visual:'RSIが30を下回ったあと、もう一度30を上回る瞬間',rsi_normal:'RSIは0〜100で売られすぎ・買われすぎを測る指標です。一般的に30以下は売られすぎ、70以上は買われすぎとされます。30以下から再び30を上回る瞬間を回復サインとして見ます。',rsi_eli5:'伸ばしすぎたゴムが少し戻り始めるイメージです。30より下から戻ってくると反発の可能性を見ます。',volume_title:'③ 出来高急増 — 人が急に集まるとき',volume_visual:'当日の出来高が直近20日平均の1.5倍以上になる瞬間',volume_normal:'出来高は1日にどれだけ売買されたかを示します。直近20日平均に対して当日の出来高が1.5倍以上なら急増と判断し、MACDやRSIのシグナルを裏付ける材料にします。',volume_eli5:'いつも空いている売店に急に大勢が集まるようなものです。いつもより人が多ければ「何か起きている」と考えます。',combo_title:'なぜ3つ一緒に見るの？',combo_normal:'MACDはトレンド転換、RSIは売られすぎからの回復、出来高は参加者の増加を確認します。性質の違う3つが最近の数本の足でそろうほど、単独指標よりだましを減らせます。',combo_eli5:'違う3人の友だちがみんな同じことを言えば、1人だけより信じやすいですよね。',back_home:'← ダッシュボードホーム',back_table:'実際のシグナルを見る →',disclaimer:'投資判断はご自身の責任で行ってください。本ページは参考指標であり、売買の推奨ではありません。'},
en:{page_title:'Understanding the Buy-Signal Indicators',h1:'How Are These Signals Made?',sub:'See the 3 indicators the dashboard uses as simple visuals before reading the explanation.',level_normal:'🎓 Standard explanation',level_eli5:'🧒 Explain it like I’m a kid',macd_tab:'① MACD Cross',rsi_tab:'② RSI Rebound',volume_tab:'③ Volume Spike',macd_title:'① MACD Cross — Trend Reversal',macd_visual:'The blue MACD line crosses above the orange signal line as the histogram flips positive',macd_normal:'MACD compares short-term and long-term momentum. When the MACD line crosses above the signal line and the histogram flips from negative to positive, it can suggest the trend is turning upward. Because MACD is lagging, this dashboard confirms it with RSI and volume.',macd_eli5:'Imagine a faster runner coming from behind and passing the runner in front. That passing moment is the MACD cross — a simple sign that the direction may be changing.',rsi_title:'② RSI Rebound — Recovering From Oversold',rsi_visual:'RSI drops below 30, then climbs back above 30',rsi_normal:'RSI ranges from 0 to 100 and helps show whether a stock has been sold or bought too aggressively. Below 30 is commonly called oversold and above 70 overbought. This dashboard focuses on RSI recovering back above 30 after being oversold.',rsi_eli5:'Think of a rubber band stretched too far and then starting to spring back. Coming back above 30 is the “maybe it’s bouncing” moment.',volume_title:'③ Volume Spike — Sudden Crowd Interest',volume_visual:'Today’s volume rises to at least 1.5× the recent 20-day average',volume_normal:'Volume measures how many shares were traded. When today’s volume reaches at least 1.5 times the recent 20-day average, the dashboard treats it as a spike. It acts as confirmation that real participation is increasing behind the MACD and RSI signals.',volume_eli5:'It’s like a quiet cafeteria suddenly filling with people. A much bigger crowd tells you something unusual may be happening.',combo_title:'Why look at all 3 together?',combo_normal:'MACD checks trend reversal, RSI checks recovery from oversold conditions, and volume checks whether participation is really increasing. When all three appear within the recent few bars, false signals are less likely than when relying on only one indicator.',combo_eli5:'If three very different friends all say “this looks real,” that is usually more convincing than hearing it from just one.',back_home:'← Dashboard home',back_table:'See it in action →',disclaimer:'Investment decisions are your own responsibility. Reference indicators only — not a buy/sell recommendation.'}
};var K='sa_lang';function apply(l){document.documentElement.lang=l;document.querySelectorAll('[data-i18n]').forEach(function(el){var k=el.dataset.i18n;el.innerHTML=(D[l]&&D[l][k])||(D.ko[k]||'')});document.querySelectorAll('.i18n-switch button').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));try{localStorage.setItem(K,l)}catch(e){}}document.querySelectorAll('.i18n-switch button').forEach(b=>b.onclick=()=>apply(b.dataset.lang));var l='ko';try{l=localStorage.getItem(K)||l}catch(e){}apply(l)})();
</script>
