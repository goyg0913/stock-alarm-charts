<script>
(function() {
  var LEVEL_KEY = "sa_level";
  var IND_KEY = "sa_indicator";
  var levelButtons = document.querySelectorAll(".level-switch button");
  var indButtons = document.querySelectorAll(".ind-switch button");
  var INDS = ["macd", "rsi", "volume"];

  function applyLevel(level) {
    document.body.classList.toggle("eli5", level === "eli5");
    levelButtons.forEach(function(b) { b.classList.toggle("active", b.dataset.level === level); });
    try { localStorage.setItem(LEVEL_KEY, level); } catch (e) {}
  }

  function applyInd(ind) {
    INDS.forEach(function(i) { document.body.classList.toggle("ind-" + i, i === ind); });
    indButtons.forEach(function(b) { b.classList.toggle("active", b.dataset.ind === ind); });
    try { localStorage.setItem(IND_KEY, ind); } catch (e) {}
  }

  levelButtons.forEach(function(b) {
    b.addEventListener("click", function() { applyLevel(b.dataset.level); });
  });
  indButtons.forEach(function(b) {
    b.addEventListener("click", function() { applyInd(b.dataset.ind); });
  });

  var initialLevel = "normal";
  try { initialLevel = localStorage.getItem(LEVEL_KEY) || "normal"; } catch (e) {}
  applyLevel(initialLevel);

  var initialInd = "macd";
  try { initialInd = localStorage.getItem(IND_KEY) || "macd"; } catch (e) {}
  applyInd(initialInd);
})();
</script>

  var DICT = {"ko": {"page_title": "매수 신호 지표 쉽게 알아보기", "h1": "이 신호, 어떻게 나온 거예요?", "sub": "대시보드가 매수 신호를 판단할 때 실제로 쓰는 3가지 지표예요. 궁금한 지표 버튼을 눌러서 하나씩 읽어보세요.", "level_normal": "🎓 일반 설명", "level_eli5": "🧒 초등학생도 이해하는 설명", "macd_tab": "① MACD 크로스", "rsi_tab": "② RSI 반등", "volume_tab": "③ 거래량 급증", "macd_title": "① MACD 크로스 — 추세 전환", "macd_normal": "MACD는 '단기 이동평균선'과 '장기 이동평균선'의 차이를 하나의 선으로 그린 지표예요. 이 MACD선이 그 차이의 평균을 나타내는 '시그널선'을 아래에서 위로 뚫고 올라가면, 최근 가격 흐름이 하락에서 상승 쪽으로 바뀌고 있다는 신호로 봅니다. 반대로 MACD선이 시그널선 아래에 계속 머물러 있으면 아직 하락 추세가 이어지고 있다는 뜻이에요. 이 대시보드는 히스토그램(MACD선과 시그널선의 차이)이 음수에서 양수로 바뀌는 바로 그 순간, 즉 두 선이 교차하는 시점을 잡아서 신호로 씁니다. 다만 MACD는 원래 '후행지표'라서 실제 바닥을 찍고 어느 정도 지난 뒤에야 신호가 뜨는 경우가 많다는 점은 참고해 두면 좋아요 — 그래서 이 대시보드는 MACD 혼자만 보지 않고 RSI, 거래량과 함께 확인합니다.", "macd_eli5": "친구 두 명이 달리기를 해요. 한 명은 원래 느리게 뛰던 친구고(이 친구를 '오랫동안의 흐름'이라고 생각해봐요), 다른 한 명은 요 며칠 사이에 갑자기 스퍼트를 낸 빠른 친구예요(이 친구는 '요즘의 흐름'이에요). 처음엔 느린 친구가 앞서 있었는데, 빠른 친구가 점점 따라붙다가 어느 순간 딱! 하고 앞질러버려요. 바로 그 추월하는 순간이 'MACD 크로스'예요. 마치 술래잡기에서 갑자기 술래가 바뀌는 것처럼, \"어? 분위기가 완전히 바뀌었네?\" 하고 다들 눈치채는 순간이죠. 그런데 이 신호는 추월한 걸 다 같이 확인한 '다음에' 알려주는 거라서, 사실 조금 늦게 알려주는 편이에요. 그래도 \"아, 흐름이 바뀌기 시작했구나\"를 알아채는 데는 큰 도움이 된답니다. 그래서 선생님(이 대시보드)은 이 친구 말만 믿지 않고 RSI, 거래량이라는 다른 두 친구한테도 꼭 같이 물어봐요.", "rsi_title": "② RSI 반등 — 너무 많이 떨어졌다가 돌아오기", "rsi_normal": "RSI(상대강도지수)는 0에서 100 사이의 숫자로 '최근에 이 주식이 너무 많이 팔렸는지 혹은 너무 많이 샀는지'를 재는 지표예요. 보통 30 이하면 '과매도' 구간이라고 부르고, 반대로 70 이상이면 '과매수' 구간이라고 불러요. 이 대시보드가 주목하는 건 과매도 구간(30 이하)까지 떨어졌던 RSI가 다시 30 위로 올라오는 순간이에요 — 팔려는 힘이 약해지고 사려는 힘이 조금씩 살아나기 시작했다는 신호로 해석하는 거죠. 다만 RSI가 30 밑에서 한참을 머무를 수도 있다는 점(주가가 계속 떨어지는 경우)은 꼭 기억해 두세요. 그래서 RSI 하나만으로 매수를 결정하지 않고, MACD와 거래량까지 같이 확인하는 거예요.", "rsi_eli5": "고무줄을 생각해봐요. 고무줄을 손으로 너무 세게 잡아당기면(주가가 너무 많이 떨어지면), 어느 순간부터는 잡고 있는 손을 놓지 않아도 저절로 다시 돌아오려는 힘이 생기죠? RSI는 바로 '지금 이 고무줄이 얼마나 늘어나 있는지'를 재는 자예요. 숫자가 30보다 작으면 고무줄이 아주 많이 늘어난 상태고, 70보다 크면 반대로 너무 많이 압축된 상태예요. 이 대시보드는 고무줄이 많이 늘어났다가(30 이하) 다시 줄어들기 시작하면 \"어! 이제 튕겨 돌아오려나 보다!\" 하고 신호를 줍니다. 그런데 가끔은 고무줄이 계속 늘어나기만 할 때도 있어요 — 그래서 이 신호 하나만 믿지 않고, 다른 친구들(MACD, 거래량)한테도 꼭 확인을 받는답니다.", "volume_title": "③ 거래량 급증 — 사람들이 갑자기 몰릴 때", "volume_normal": "거래량은 그 주식이 하루 동안 얼마나 많이 사고팔렸는지를 나타내는 숫자예요(주식 수 기준). 이 대시보드는 최근 20일 평균 거래량과 오늘 거래량을 비교해서, 오늘 거래량이 평균의 일정 배수(기본 1.5배) 이상이면 '거래량 급증'으로 판단해요. 거래량이 갑자기 늘었다는 건 그만큼 많은 사람이 그 종목에 관심을 갖고 사고팔기 시작했다는 뜻이라, 다른 지표(MACD, RSI)가 보내는 신호가 진짜인지 뒷받침해 주는 역할을 해요. 반대로 거래량 없이 가격만 슬쩍 움직이는 경우엔, 그 움직임이 오래가지 못하고 금방 사그라들 때가 많아요. 그래서 이 대시보드는 거래량을 '검증용 지표'로 꼭 같이 확인합니다.", "volume_eli5": "학교 매점을 떠올려봐요. 평소엔 쉬는 시간에 몇 명만 슬쩍 가는데, 어느 날 갑자기 우르르 엄청 많은 친구들이 몰려가면 \"오늘 뭔가 특별한 게 있나 보다!\" 하고 바로 눈치채잖아요. 주식의 거래량도 똑같아요 — 평소보다 훨씬 많은 사람이 그 주식을 사고팔면, \"어? 이 종목에 관심이 확 쏠리고 있네!\" 하는 신호예요. 이 대시보드는 오늘 거래량이 최근 20일 평균보다 1.5배 넘게 많으면 이 신호를 켜줘요. 그런데 사람이 별로 없는데 가격만 살짝 움직이는 건 별로 안 믿을만해요 — 마치 매점에 아무도 없는데 소문만 도는 것처럼요. 그래서 이 대시보드는 다른 친구들(MACD, RSI)이 신호를 보낼 때, \"진짜야?\"하고 거래량한테 꼭 다시 확인해요.", "combo_title": "그럼 왜 3개를 같이 봐요?", "combo_normal": "3개 지표 중 하나만 보면 속기 쉬워요. MACD만 보면 이미 오른 다음에 뒤늦게 신호가 뜰 수 있고, RSI만 보면 계속 떨어지는 중에 성급하게 신호가 뜰 수도 있고, 거래량만 보면 별다른 이유 없이 반짝 튄 거래량에 낚일 수도 있어요. 그래서 이 대시보드는 추세 전환(MACD) + 과매도 회복(RSI) + 거래량 검증, 이렇게 성격이 서로 다른 3개 축이 최근 몇 봉(기본 3봉) 이내에 동시에 '활성' 상태가 됐을 때만 진짜 매수 신호로 인정해요. 세 조건이 완벽히 같은 봉에서 딱 맞아떨어지는 일은 거의 없어서, 최근 며칠 안에만 발생했으면 넉넉하게 '아직 유효하다'고 봐주는 것도 포인트예요.", "combo_eli5": "친구 한 명 말만 듣고 판단하면 가끔 틀릴 수 있죠? MACD 친구는 원래 좀 느려서 이미 다 오른 다음에야 말해줄 때가 있고, RSI 친구는 성격이 급해서 아직 떨어지는 중인데도 성급하게 말할 때가 있고, 거래량 친구는 가끔 별일 아닌데도 잠깐 흥분해서 소란을 피울 때가 있어요. 그런데 서로 다른 성격의 친구 세 명이 다 같이 \"어, 이거 진짜인 것 같아!\"라고 입을 모으면 훨씬 믿을 만하겠죠? 이 대시보드도 딱 그래요 — 세 지표가 최근 며칠 사이에 다 같이 신호를 보내야만 진짜 '매수 신호'로 인정해줘요. 세 명이 정확히 같은 순간에 동시에 말하는 건 어려우니까, 최근 며칠 안에만 말했으면 \"아직 유효해!\" 하고 너그럽게 봐주는 것도 재밌는 포인트예요.", "back_home": "← 대시보드 홈", "back_table": "실제 신호 보러 가기 →", "disclaimer": "투자 판단은 본인 책임입니다. 참고용 지표일 뿐 매수·매도 추천이 아닙니다."}, "ja": {"page_title": "買いシグナルの指標をやさしく解説", "h1": "このシグナル、どうやって出るの？", "sub": "ダッシュボードが買いシグナルを判断するときに実際に使う3つの指標です。気になる指標のボタンを押して、ひとつずつ読んでみてください。", "level_normal": "🎓 通常の説明", "level_eli5": "🧒 小学生でもわかる説明", "macd_tab": "① MACDクロス", "rsi_tab": "② RSI反発", "volume_tab": "③ 出来高急増", "macd_title": "① MACDクロス — トレンド転換", "macd_normal": "MACDは「短期移動平均線」と「長期移動平均線」の差を1本の線で表した指標です。このMACD線が、その差の平均を示す「シグナル線」を下から上に突き抜けると、最近の値動きが下降から上昇へ変わりつつあるサインとみなします。逆にMACD線がシグナル線の下にとどまっている間は、まだ下降トレンドが続いているという意味です。このダッシュボードは、ヒストグラム(MACD線とシグナル線の差)がマイナスからプラスに変わる瞬間、つまり2本の線が交差する時点を捉えてシグナルとして使います。ただしMACDは元々「遅行指標」なので、実際の底を打ってからしばらく経ってからシグナルが出ることが多い点は覚えておくとよいでしょう — だからこのダッシュボードはMACD単体ではなく、RSIや出来高と合わせて確認します。", "macd_eli5": "友だち2人が競走をしています。1人はもともとゆっくり走っていた友だち（この子を「長い間の流れ」だと思ってください）、もう1人はここ数日で急にスパートをかけた速い友だち（この子は「最近の流れ」です）。最初は遅い友だちが前にいたのに、速い友だちがどんどん追いついてきて、ある瞬間ピタッと追い抜いてしまいます。その追い抜く瞬間こそが「MACDクロス」なんです。鬼ごっこで急に鬼が交代するみたいに、「あれ、雰囲気がすっかり変わったぞ？」とみんなが気づく瞬間です。ただ、このサインは追い抜いたのをちゃんと確認した「あと」で教えてくれるので、実は少し遅れて分かるタイプなんです。それでも「あ、流れが変わり始めたな」と気づくのにはとても役立ちます。だから先生（このダッシュボード）は、この子の言葉だけを信じず、RSIと出来高という他の2人の友だちにも必ず一緒に聞くようにしているんです。", "rsi_title": "② RSI反発 — 下がりすぎからの回復", "rsi_normal": "RSI（相対力指数）は0から100までの数字で、「最近この銘柄が売られすぎているか、買われすぎているか」を測る指標です。一般的に30以下は「売られすぎ」の圏内、70以上は「買われすぎ」の圏内と呼ばれます。このダッシュボードが注目するのは、売られすぎ圏(30以下)まで下がったRSIが再び30を上回る瞬間です — 売る力が弱まり、買う力が少しずつ戻り始めたサインと解釈します。ただし、RSIが30の下にしばらくとどまり続けることもある(株価が下がり続ける場合)点は覚えておいてください。だからこそRSIだけで判断せず、MACDや出来高も一緒に確認するのです。", "rsi_eli5": "ゴムひもを思い浮かべてください。手でゴムを強く引っぱると（株価がすごく下がると）、ある時点からは手を離さなくても自然と元に戻ろうとする力が生まれますよね？RSIはまさに「今このゴムがどれくらい伸びているか」を測るものさしです。数字が30より小さいとゴムがとても伸びている状態、70より大きいと逆にすごく縮んでいる状態です。このダッシュボードは、ゴムが大きく伸びたあと（30以下）また縮み始めたら「あ、そろそろ戻ってきそう！」というサインを出します。ただ、時にはゴムが伸び続けたままのこともあります — だからこのサインだけを信じず、ほかの友だち（MACD、出来高）にも必ず確認してもらうんです。", "volume_title": "③ 出来高急増 — 人が急に集まるとき", "volume_normal": "出来高とは、その株が1日にどれくらい売買されたかを示す数字です(株数ベース)。このダッシュボードは直近20日間の平均出来高と当日の出来高を比較し、当日の出来高が平均の一定倍率(デフォルト1.5倍)以上なら「出来高急増」と判断します。出来高が急に増えたということは、それだけ多くの人がその銘柄に関心を持ち、売買を始めたという意味なので、ほかの指標(MACD、RSI)が出すシグナルが本物かどうかを裏付ける役割を果たします。逆に出来高が伴わずに価格だけがわずかに動く場合、その動きは長続きせずすぐにしぼんでしまうことが多いです。だからこのダッシュボードは出来高を「裏付け用の指標」として必ず一緒に確認します。", "volume_eli5": "学校の売店を思い浮かべてください。いつもは休み時間に数人しかこっそり行かないのに、ある日突然たくさんの友だちがどっと押し寄せたら「今日は何か特別なことがあるんだ！」とすぐ気づきますよね。株の出来高も同じです — いつもよりずっと多くの人がその株を売買すると、「あれ、この銘柄に注目が集まっている！」というサインです。このダッシュボードは、当日の出来高が直近20日間の平均の1.5倍を超えたら、このサインを出します。でも、人がほとんどいないのに値段だけがちょっと動くのはあまり信用できません — まるで売店に誰もいないのに噂だけが広がっているようなものです。だからこのダッシュボードは、ほかの友だち（MACD、RSI）がサインを出したとき、「本当かな？」と出来高にも必ず聞き直すんです。", "combo_title": "じゃあ、なぜ3つ一緒に見るの？", "combo_normal": "3つの指標のうち1つだけを見ると、だまされやすくなります。MACDだけを見ると、すでに上がったあとに遅れてサインが出ることがありますし、RSIだけを見ると、下がり続けている途中で早まってサインが出てしまうこともあります。出来高だけを見ると、特に理由もなく一時的に増えた出来高に惑わされることもあります。だからこのダッシュボードは、トレンド転換(MACD)＋売られすぎからの回復(RSI)＋出来高による裏付け、という性質の異なる3つの軸が、直近数本のローソク足(デフォルト3本)以内に同時に「有効」になったときだけ、本当の買いシグナルとして認めます。3つの条件がぴったり同じローソク足でそろうことはほとんどないので、直近数日以内に起きていれば「まだ有効」と広めに見てあげるのもポイントです。", "combo_eli5": "友だち1人の話だけを聞いて判断すると、たまに間違えますよね？MACDくんはちょっとのんびり屋さんで、すでに上がりきったあとに教えてくれることがあります。RSIちゃんはせっかちで、まだ下がっている最中なのに早とちりして言ってしまうことも。出来高くんは、たいしたことじゃないのに一瞬興奮して騒ぐことがあります。でも、性格の違う3人の友だちが全員そろって「これ、本当っぽいよ！」と口をそろえたら、ずっと信じられそうですよね？このダッシュボードもまさにそれ — 3つの指標が直近数日のあいだに全部そろってサインを出したときだけ、本当の「買いシグナル」として認めます。3人がぴったり同じ瞬間に言うのは難しいので、直近数日以内に言っていれば「まだ有効だよ！」と大目に見てあげるのも、ちょっと面白いポイントです。", "back_home": "← ダッシュボードホーム", "back_table": "実際のシグナルを見る →", "disclaimer": "投資判断はご自身の責任で行ってください。本ページは参考指標であり、売買の推奨ではありません。"}, "en": {"page_title": "Understanding the Buy-Signal Indicators", "h1": "How Are These Signals Made?", "sub": "The 3 indicators the dashboard actually relies on to call a buy signal. Tap a button below to read about one at a time.", "level_normal": "🎓 Standard explanation", "level_eli5": "🧒 Explain it like I'm a kid", "macd_tab": "① MACD Cross", "rsi_tab": "② RSI Rebound", "volume_tab": "③ Volume Spike", "macd_title": "① MACD Cross — Trend Reversal", "macd_normal": "MACD is a single line that tracks the gap between a short-term and a long-term moving average. When this MACD line crosses above its 'signal line' — which tracks the average of that gap — it suggests the recent price trend is shifting from falling to rising. Conversely, while the MACD line stays below the signal line, the downtrend is likely still in play. This dashboard captures the exact moment the histogram (the gap between the MACD and signal lines) flips from negative to positive — the instant the two lines cross — and uses that as the signal. Keep in mind MACD is a lagging indicator by nature, so it often fires a while after the actual bottom has already passed. That's exactly why this dashboard never relies on MACD alone — it always checks it together with RSI and volume.", "macd_eli5": "Picture two friends racing. One used to run slowly (think of this friend as the 'long-term trend'), and the other just sped up over the last few days (this one is the 'recent trend'). At first the slow friend was in the lead, but the fast friend keeps catching up — and at one moment, whoosh, passes right by! That exact moment of passing is the 'MACD cross.' It's like when the tagger suddenly changes in a game of tag: everyone goes, \"Whoa, the mood just totally shifted!\" But here's the thing — this signal only shows up after everyone's already confirmed the pass happened, so it tends to tell you a little late. Still, it's a great way to notice that the trend has started to change. That's exactly why the teacher (this dashboard) never trusts this one friend alone — it always double-checks with the other two friends, RSI and volume.", "rsi_title": "② RSI Rebound — Bouncing Back From Oversold", "rsi_normal": "RSI (Relative Strength Index) is a number between 0 and 100 that measures whether a stock has recently been sold too much or bought too much. Readings of 30 or below are usually called 'oversold,' while 70 or above is 'overbought.' What this dashboard watches for is the moment RSI, after dropping into oversold territory (30 or below), climbs back above 30 — interpreted as a sign that selling pressure is fading and buying interest is starting to return. Keep in mind, though, that RSI can stay below 30 for a long stretch if the price keeps falling. That's exactly why RSI is never used alone here — it's always checked together with MACD and volume.", "rsi_eli5": "Think of a rubber band. If you pull it really hard with your hand (the price drops a lot), at some point it starts wanting to snap back on its own, even without letting go, right? RSI is exactly the ruler that measures how stretched that rubber band is right now. A number below 30 means the band is stretched a lot; above 70 means it's squished the opposite way instead. This dashboard sends a signal when the band stretches a lot (30 or below) and then starts shrinking back — that's the 'hey, it might snap back soon!' moment. But sometimes the band just keeps stretching and stretching — so this signal is never trusted alone. It always gets double-checked with the other friends, MACD and volume.", "volume_title": "③ Volume Spike — Sudden Crowd Interest", "volume_normal": "Volume is the number of shares of a stock that were bought and sold in a day. This dashboard compares today's volume to the 20-day average, and if today's volume is at least a certain multiple of that average (1.5x by default), it flags a 'volume spike.' A sudden jump in volume means a lot more people suddenly started paying attention to and trading that stock, which helps confirm whether signals from the other indicators (MACD, RSI) are the real deal. On the other hand, when price moves without volume behind it, that move often fizzles out quickly. That's why this dashboard always treats volume as a confirmation indicator, checked alongside the others.", "volume_eli5": "Imagine your school cafeteria. Usually only a few kids sneak in during break time, but one day a huge crowd suddenly rushes in — you'd instantly think, 'Something special must be happening today!' Stock volume works the same way: when way more people than usual are buying and selling a stock, it's a sign that everyone's attention just rushed toward it. This dashboard turns this signal on when today's volume is more than 1.5 times the recent 20-day average. But if barely anyone shows up and the price just wiggles a little, that's not very trustworthy — like a rumor spreading through an empty cafeteria. That's why, whenever the other friends (MACD, RSI) send a signal, this dashboard always double-checks with volume by asking, 'Is this for real?'", "combo_title": "So why look at all 3 together?", "combo_normal": "Relying on just one of these three indicators can be misleading. MACD alone might only fire after the price has already risen. RSI alone might fire too early while the price is still falling. Volume alone can be fooled by a random, one-off spike with no real reason behind it. That's why this dashboard only counts it as a real buy signal when three different angles — trend reversal (MACD), recovery from oversold (RSI), and volume confirmation — are all active within the last few bars (3, by default). Since it's rare for all three to line up on the exact same bar, the dashboard generously treats a signal as 'still valid' as long as it happened within that recent window.", "combo_eli5": "If you only listen to one friend, you might get it wrong sometimes. MACD-friend is a bit slow and sometimes only speaks up after the price has already climbed. RSI-friend is impatient and sometimes jumps in too early, while the price is still falling. Volume-friend occasionally gets excited and makes noise over nothing much. But when three friends with totally different personalities all say, \"Hey, this looks real!\" at once — that's a lot more convincing, right? This dashboard works exactly that way: it only counts it as a real 'buy signal' when all three indicators speak up within the same few recent days. Since it's hard for three friends to say it at the exact same instant, the dashboard is generous — as long as they all spoke up recently, it still counts as valid. Kind of a fun detail, honestly.", "back_home": "← Dashboard home", "back_table": "See it in action →", "disclaimer": "Investment decisions are your own responsibility. Reference indicators only — not a buy/sell recommendation."}};
  var KEY = "sa_lang";

  function apply(lang) {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(function(el) {
      var k = el.getAttribute("data-i18n");
      var tpl = (DICT[lang] && DICT[lang][k]) || (DICT.ko && DICT.ko[k]) || "";
      var n = el.getAttribute("data-i18n-n");
      el.innerHTML = n !== null ? tpl.split("{n}").join("<b>" + n + "</b>") : tpl;
    });
    document.querySelectorAll("[data-i18n-ph]").forEach(function(el) {
      var k = el.getAttribute("data-i18n-ph");
      el.placeholder = (DICT[lang] && DICT[lang][k]) || "";
    });
    document.querySelectorAll("[data-i18n-title]").forEach(function(el) {
      var k = el.getAttribute("data-i18n-title");
      el.title = (DICT[lang] && DICT[lang][k]) || "";
    });
    document.querySelectorAll(".i18n-switch button").forEach(function(b) {
      b.classList.toggle("active", b.dataset.lang === lang);
    });
    try { localStorage.setItem(KEY, lang); } catch (e) {}
  }

  document.querySelectorAll(".i18n-switch button").forEach(function(b) {
    b.addEventListener("click", function() { apply(b.dataset.lang); });
  });

  var initial = "ko";
  try { initial = localStorage.getItem(KEY) || "ko"; } catch (e) {}
  apply(initial);
})();
</script>
