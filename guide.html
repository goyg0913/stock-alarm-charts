<script>
(function(){
var D={
  "ko": {
    "break_title": "잠시 쉬어가도 괜찮아요",
    "break_message": "MACD, RSI, 거래량… 한 번에 다 이해하지 않아도 괜찮아요. 잠깐 눈을 쉬고, 준비되면 세 지표를 함께 보는 이유를 천천히 읽어보세요.",
    "break_alt": "따뜻한 찻잔과 화분 옆 창가에서 편안히 쉬는 고양이",
    "page_title": "매수 신호 지표 쉽게 알아보기",
    "h1": "이 신호, 어떻게 나온 거예요?",
    "sub": "그림으로 살펴보고, 숫자 예시로 이해해 보세요. 일반 설명과 쉬운 설명 중 편한 쪽을 고르면 됩니다.",
    "level_normal": "🎓 일반 설명",
    "level_eli5": "🧒 초등학생도 이해하는 설명",
    "macd_tab": "① MACD 크로스",
    "rsi_tab": "② RSI 반등",
    "volume_tab": "③ 거래량 급증",
    "macd_title": "① MACD 크로스 — 흐름이 나아지는지 보기",
    "macd_visual": "파란 MACD선이 주황 시그널선을 아래에서 위로 넘고, 히스토그램이 +로 바뀌는 순간",
    "macd_normal": "<h3>무엇을 보는 지표인가요?</h3><p>MACD는 최근 가격 흐름이 이전보다 강해지는지 살펴보는 지표예요. 이동평균은 일정 기간 가격을 평균 내어 잔파도를 줄인 선이고, EMA(지수이동평균)는 최근 가격에 더 큰 비중을 줍니다. 널리 쓰는 설정은 12·26·9이지만, 차트 설정에 따라 달라질 수 있어요.</p><h3>두 선과 막대를 읽는 순서</h3><p>① MACD선은 짧은 기간 EMA에서 긴 기간 EMA를 뺀 값입니다. ② 시그널선은 MACD를 다시 평균 내어 부드럽게 만든 비교선이에요. ③ 히스토그램은 MACD선 − 시그널선입니다. 따라서 MACD가 시그널 위로 올라가는 것과 막대가 음수에서 양수로 바뀌는 것은 같은 관계를 두 방식으로 보여줍니다.</p><h3>숫자로 보면 쉬워요 · 가상 예시</h3><p>어제 MACD가 −0.8, 시그널이 −0.6이면 막대는 −0.2입니다. 오늘 MACD가 −0.3, 시그널이 −0.5라면 막대는 +0.2예요. MACD가 시그널보다 아래에 있다가 위로 올라왔으므로 상향 교차입니다. 두 선이 아직 0 아래에 있어도 이런 교차는 생길 수 있어요.</p><h3>이렇게 해석해 보세요</h3><p>최근 흐름이 개선되는 단서로 읽되, 주가가 바닥을 찍었다고 단정하지는 마세요. 시그널선 돌파와 MACD 자체의 0선 돌파는 서로 다른 사건입니다. 평균을 쓰므로 가격보다 늦게 반응하고, 횡보장에서는 교차가 자주 되돌려질 수 있어요. 실제 가격 흐름과 RSI·거래량을 이어서 살펴보세요.</p>",
    "macd_eli5": "<h3>달리기 기록 두 개를 떠올려 봐요</h3><p>한 친구의 최근 달리기 기록과 조금 더 오래된 기록을 비교한다고 생각해 봐요. 최근 기록이 좋아지는지 살펴보는 느낌이 MACD예요. 실제로는 주가의 평균을 계산해서 만듭니다.</p><h3>그림에서는 무엇을 찾나요?</h3><p>파란 선은 MACD, 주황 선은 비교 기준인 시그널이에요. 파란 선이 주황 선 아래에 있다가 위로 넘어가면 ‘최근 흐름이 조금 나아지나?’ 하고 보는 거예요. 막대가 아래쪽에서 위쪽으로 바뀌는 것도 두 선의 관계를 보여줍니다.</p><h3>예를 들어 볼게요</h3><p>어제는 파란 선이 주황 선보다 0.2 낮았고 오늘은 0.2 높아졌다고 해봐요. 두 선의 순서가 바뀌었죠? 이것이 상향 교차예요. 숫자를 모두 외울 필요 없이 ‘아래에 있던 선이 위로 넘어왔는가’를 먼저 보세요.</p><h3>꼭 기억할 점</h3><p>달리기 기록이 하루 좋아졌다고 다음 경기 우승이 정해지는 건 아니에요. MACD 신호도 앞으로 주가가 꼭 오른다는 약속은 아닙니다. 주가가 어떻게 움직였는지, 다른 지표는 어떤지도 함께 확인해요.</p>",
    "rsi_title": "② RSI 반등 — 너무 많이 떨어졌다가 돌아오기",
    "rsi_visual": "RSI가 30 아래까지 내려간 뒤 다시 30 위로 올라오는 순간",
    "rsi_normal": "<h3>RSI는 가격 움직임의 힘을 요약해요</h3><p>RSI는 일정 기간의 평균 상승폭과 평균 하락폭을 비교해 0~100으로 나타냅니다. 상승한 날의 개수만 세는 것도, 매수한 사람의 비율을 보여주는 것도 아니에요. 흔히 14기간을 사용하며 일봉이라면 하루 단위로 계산합니다. 실제 설정에 따라 값은 달라질 수 있어요.</p><h3>30과 70은 어떻게 읽나요?</h3><p>보통 30 아래를 과매도, 70 위를 과매수 구간이라고 부릅니다. 최근 하락 또는 상승의 힘이 한쪽으로 치우쳤다는 뜻이에요. RSI 30은 ‘주가가 30% 떨어졌다’는 뜻이 아니고, 낮은 RSI만으로 기업 가치보다 싸다고 판단할 수도 없습니다.</p><h3>28 → 32와 35 → 32의 차이 · 가상 예시</h3><p>월요일 28, 화요일 29, 수요일 32라면 30 아래에 머물던 RSI가 다시 위로 올라왔어요. 이 가이드가 설명하는 회복 신호는 이런 움직임입니다. 반대로 어제 35, 오늘 32라면 현재 값은 같아도 30을 아래에서 위로 넘은 것이 아니에요. 오늘 숫자와 직전 흐름을 함께 보세요.</p><h3>낮다고 바로 반등하지는 않아요</h3><p>강한 하락 중에는 RSI가 낮게 유지되거나 30을 잠깐 넘었다가 다시 내려갈 수 있어요. 강한 상승 중에는 70 위에 오래 머물기도 합니다. 가격이 새 저점을 만드는지, 반등이 이어지는지, 거래량은 어떤지 함께 살펴보세요.</p>",
    "rsi_eli5": "<h3>가격 움직임의 온도계라고 생각해 봐요</h3><p>RSI는 최근 가격이 오르는 힘과 내리는 힘을 0~100 눈금으로 보여주는 도구예요. 몸의 온도계처럼 상태를 살피는 데 도움을 주지만, 미래를 알려주는 도구는 아니에요.</p><h3>예를 들어 28 → 29 → 32</h3><p>눈금이 30 아래에 있다가 32까지 올라왔어요. ‘내리던 힘이 조금 약해지고 있나?’ 하고 관찰할 수 있죠. 하지만 35에서 32로 내려온 것은 다른 상황이에요. 같은 32라도 어디에서 왔는지가 중요합니다.</p><h3>30점짜리 주식이라는 뜻은 아니에요</h3><p>RSI 30은 시험 점수도, 주식 가격도, 30% 할인 표시도 아니에요. 최근 가격 움직임을 계산한 숫자입니다. 70을 넘었다고 곧바로 나쁜 주식이 되는 것도 아니고요.</p><h3>한 번 더 살펴봐요</h3><p>낮은 눈금이 계속 낮게 머물 수도 있어요. 30을 넘었는지 본 뒤, 가격도 회복하고 있는지와 다른 지표도 천천히 확인해 보세요.</p>",
    "volume_title": "③ 거래량 급증 — 평소보다 활발한 거래",
    "volume_visual": "오늘 거래량이 최근 20일 평균보다 1.5배 이상 커지는 순간",
    "volume_normal": "<h3>거래량은 거래된 주식 수예요</h3><p>하루에 100만 주가 거래됐다면 거래량은 100만 주입니다. 거래대금이나 거래한 사람 수와는 달라요. 같은 주식이 여러 번 거래될 수 있고, 모든 체결에는 매수자와 매도자가 함께 있습니다. 거래량 증가만으로 ‘사는 사람만 늘었다’고 말할 수는 없어요.</p><h3>평소와 비교해야 의미가 있어요</h3><p>거래량 비율은 비교 대상 기간의 거래량 ÷ 기준 평균 거래량으로 읽습니다. 이 가이드의 기준은 최근 20일 평균 대비 1.5배 이상이에요. 1.5배는 모든 종목에 통하는 절대 법칙이 아니라 여기서 사용하는 판단 기준입니다.</p><h3>100만 주 → 180만 주 · 가상 예시</h3><p>기준 평균이 100만 주, 오늘 거래량이 180만 주라면 180 ÷ 100 = 1.8배입니다. 평균보다 80% 많고 1.5배 기준을 넘습니다. 120만 주라면 1.2배이므로 기준에 못 미쳐요. 1.5배는 ‘150% 증가’가 아니라 ‘50% 증가’입니다.</p><h3>가격 방향과 시간을 함께 보세요</h3><p>가격 상승과 큰 거래량이 함께 나타나는 경우와 급락하면서 거래량이 커지는 경우는 해석이 다릅니다. 실적 발표 같은 일회성 뉴스 때문일 수도 있어요. 장중 누적 거래량은 아직 하루치가 아니므로 하루 평균과 비교할 때 시점을 확인하세요. 큰 막대 자체가 상승 방향을 보장하지는 않습니다.</p>",
    "volume_eli5": "<h3>매점에서 팔린 빵의 개수를 생각해 봐요</h3><p>평소 하루 100개 팔리던 빵이 오늘 180개 팔렸다면 거래가 평소보다 활발한 거죠. 거래량도 비슷하게 ‘몇 주가 거래됐는가’를 셉니다. 매점에 온 사람 수를 세는 것과는 달라요.</p><h3>몇 배인지 직접 계산해 봐요</h3><p>180 ÷ 100 = 1.8배예요. 이 가이드에서는 평소의 1.5배 이상인지 살펴봐요. 100개에서 150개가 되면 1.5배, 120개라면 1.2배입니다.</p><h3>많이 팔렸다고 가격도 오를까요?</h3><p>할인 행사 때문에 빵이 많이 팔릴 수도 있죠. 주식도 가격이 떨어지며 거래량이 늘 수 있어요. 그래서 큰 막대를 찾은 다음에는 가격이 올랐는지 내렸는지도 봐야 합니다.</p><h3>비교 시간도 맞춰 봐요</h3><p>아침에 팔린 개수와 평소 하루 전체 개수를 바로 비교하면 헷갈리겠죠? 주식 거래량도 오늘 장이 끝난 값인지, 아직 거래 중인 값인지 확인해요.</p>",
    "combo_title": "그럼 왜 3개를 같이 봐요?",
    "combo_normal": "<h3>서로 다른 질문을 묶어 보세요</h3><p>MACD는 ‘흐름이 개선되는가?’, RSI는 ‘최근 하락의 힘에서 회복하는가?’, 거래량은 ‘평소보다 거래가 활발한가?’를 살피는 데 쓰입니다. MACD와 RSI는 모두 가격에서 계산하므로 완전히 독립적인 증거는 아닙니다. 세 조건을 만족한다고 성공 확률이 자동으로 정해지지는 않아요.</p><h3>한 종목을 읽어보는 순서 · 가상 예시</h3><p>① RSI가 28에서 32로 올라왔는지 확인합니다. ② MACD가 시그널 아래에서 위로 교차했는지 봅니다. ③ 거래량이 평균 100만 주 대비 180만 주, 즉 1.8배인지 계산합니다. 마지막으로 실제 가격이 반등 중인지, 급락 뉴스가 있었는지 확인합니다. 이는 읽는 순서의 예시이며, 신호가 반드시 이 순서로 발생해야 한다는 뜻은 아닙니다.</p><h3>시간이 다르면 해석도 달라져요</h3><p>일봉의 한 봉은 하루, 주봉의 한 봉은 한 주입니다. 같은 종목이라도 기간이 다르면 신호가 다를 수 있어요. 최근 여러 봉을 보는 방식에서는 오늘 수치만으로 과거에 발생한 신호를 설명할 수 없으므로, 신호 발생 시점과 화면의 기준 시각도 확인하세요.</p><h3>마지막으로 스스로 확인해 보세요</h3><p>RSI가 낮기만 한가요, 실제로 30 위로 돌아왔나요? MACD가 시그널을 넘었나요, 단지 올라가는 중인가요? 거래량 증가는 상승과 함께인가요, 하락과 함께인가요? 세 신호가 모여도 반등이 실패할 수 있습니다. 이 예시는 실제 종목의 매수 지시가 아니라 차트를 읽는 연습입니다.</p>",
    "combo_eli5": "<h3>세 가지 질문을 차례로 해봐요</h3><p>‘최근 흐름이 나아졌나?’는 MACD, ‘내리던 힘에서 돌아오나?’는 RSI, ‘거래가 평소보다 많나?’는 거래량으로 살펴봐요. 같은 장면을 서로 다른 도구로 관찰하는 느낌입니다.</p><h3>연습해 볼까요?</h3><p>RSI가 28에서 32로 올라오고, 파란 MACD선이 주황 선을 넘고, 거래량이 평소의 1.8배라고 해봐요. 세 가지 단서가 모였네요. 이제 실제 가격도 회복하는지 확인해요. 거래량만 많고 가격이 크게 떨어진다면 같은 이야기로 읽으면 안 됩니다.</p><h3>정답 도장은 아니에요</h3><p>세 도구가 모두 좋아 보여도 다음 날 가격이 떨어질 수 있어요. 점수를 더해서 ‘3개니까 무조건 성공’이라고 생각하지 말고, 각 숫자가 무엇을 말하는지 설명할 수 있는지를 목표로 해봐요.</p>",

    "macd_normal": "<h3>MACDは何を見る指標？</h3><p>MACDは、最近の値動きの勢いが以前より強まっているかを考えるための指標です。移動平均は価格を平均して細かな上下をならしたもの。EMA（指数平滑移動平均）は最近の価格をより重視します。12・26・9期間がよく使われますが、設定によって変わります。</p><h3>2本の線と棒の読み方</h3><p>MACD線は短期EMAから長期EMAを引いた値です。シグナル線はMACDを平均してなめらかにした比較線。ヒストグラムは「MACD − シグナル」です。そのため、MACDがシグナルを上抜けることと棒がマイナスからプラスに変わることは、同じ関係を別の形で示しています。</p><h3>数字で考えてみましょう · 架空の例</h3><p>昨日のMACDが−0.8、シグナルが−0.6なら、棒は−0.2です。今日はMACDが−0.3、シグナルが−0.5なら、棒は＋0.2。MACDがシグナルの下から上へ移ったので、上向きのクロスです。2本ともまだゼロより下でも、このクロスは起こります。</p><h3>どこまで読み取れる？</h3><p>勢いの改善を示す手がかりですが、株価が底を打った証拠ではありません。シグナル線の上抜けと、MACD自体のゼロ超えは別の出来事です。平均を使うため価格より反応が遅れ、横ばい相場ではクロスが何度も反転することがあります。株価の動き、RSI、出来高も確認しましょう。</p>",
    "macd_eli5": "<h3>かけっこの記録を比べるイメージ</h3><p>ある子の最近の記録と、少し長い期間の記録を比べてみましょう。「最近は調子がよくなったかな？」と見る感じがMACDです。実際には株価の平均を使って計算します。</p><h3>図ではどこを見るの？</h3><p>青い線がMACD、オレンジの線が比較相手のシグナルです。青い線が下から上へ追い越したら、最近の勢いがよくなったのかな、と考えます。棒も同じ2本の線の差を表しています。</p><h3>小さな例で練習</h3><p>昨日は青い線がオレンジより0.2低く、今日は0.2高くなったとします。順番が入れ替わりましたね。これが上向きのクロスです。まずは計算を暗記するより、下から上に移ったかを見てみましょう。</p><h3>覚えておきたいこと</h3><p>記録が1日よくなっても、次の試合で必ず勝つとは限りません。MACDのクロスも株価の上昇を約束するものではないので、株価やほかの指標も一緒に見ます。</p>",
    "rsi_title": "② RSI反発 — 売られすぎからの回復",

    "rsi_normal": "<h3>RSIは値動きの強さをまとめた数字</h3><p>RSIは一定期間の平均上昇幅と平均下落幅を比べ、0〜100で表します。上がった日数だけを数えたり、買った人の割合を示したりするものではありません。14期間がよく使われ、日足なら1期間は1取引日です。設定が違えば値も変わります。</p><h3>30と70の意味</h3><p>一般に30未満は売られすぎ、70超は買われすぎと呼ばれます。最近の値動きが下落または上昇に偏っている状態を表す言葉です。RSIが30でも「株価が30％下がった」という意味ではなく、企業価値に対して割安だと判断できるわけでもありません。</p><h3>28 → 32と35 → 32は違います · 架空の例</h3><p>月曜日が28、火曜日が29、水曜日が32なら、30未満から再び30を上回っています。このガイドで説明する回復の形です。一方、昨日35で今日32なら、同じ32でも30を下から上へ超えていません。現在の数字だけでなく、そこまでの動きも見ましょう。</p><h3>低ければすぐ反発する？</h3><p>強い下落ではRSIが低いまま推移したり、一度30を超えても再び下がったりします。強い上昇では70超が長く続くこともあります。株価が安値を更新していないか、反発が続いているか、出来高はどうかを合わせて確認しましょう。</p>",
    "rsi_eli5": "<h3>値動きを見る温度計のようなもの</h3><p>RSIは最近の上がる力と下がる力を、0〜100の目盛りで表します。体温計のように今の状態を見る助けになりますが、未来を教える道具ではありません。</p><h3>たとえば28 → 29 → 32</h3><p>30より下だった数字が32まで戻りました。「下がる勢いが弱まってきたかな？」と考えるきっかけになります。ただし35から32へ下がった場合は別です。同じ32でも、どちらから来たかが大切です。</p><h3>30点の株という意味ではありません</h3><p>RSIの30はテストの点数でも、株価でも、30％引きの表示でもありません。値動きから計算した数字です。70を超えたからといって、すぐに悪い株になるわけでもありません。</p><h3>もう一度確かめよう</h3><p>低い数字がそのまま続くこともあります。30を上回ったかを見たら、株価も回復しているか、ほかの指標はどうかをゆっくり確認しましょう。</p>",

    "volume_normal": "<h3>出来高は売買された株数</h3><p>1日に100万株が売買されたなら、出来高は100万株です。売買代金や取引した人数とは違います。同じ株が何度も売買されることもあり、成立した取引には買い手と売り手の両方がいます。出来高だけで「買う人だけが増えた」とは言えません。</p><h3>普段の水準と比べます</h3><p>出来高倍率は、対象期間の出来高を基準となる平均出来高で割ったものです。このガイドでは直近20日平均の1.5倍以上を基準にしています。1.5倍はここで使う判定基準であり、どんな銘柄にも当てはまる絶対的な法則ではありません。</p><h3>100万株 → 180万株 · 架空の例</h3><p>平均が100万株で今日が180万株なら、180 ÷ 100 = 1.8倍。平均より80％多く、1.5倍の基準を超えます。120万株なら1.2倍なので基準未満です。1.5倍は「150％増」ではなく「50％増」という点にも気をつけましょう。</p><h3>価格の方向と時刻も確認</h3><p>株価上昇とともに出来高が増える場合と、急落しながら増える場合では意味が違います。決算発表など、一時的なニュースが原因のこともあります。取引時間中の累計はまだ1日分ではないので、1日平均と比べるときは時刻を確認してください。高い棒だけで上昇方向は判断できません。</p>",
    "volume_eli5": "<h3>お店で売れたパンの数を考えよう</h3><p>普段は1日100個売れるパンが今日は180個売れたら、いつもより取引が活発ですね。出来高も同じように「何株が売買されたか」を数えます。お店に来た人数とは違います。</p><h3>何倍か計算してみよう</h3><p>180 ÷ 100 = 1.8倍です。このガイドでは普段の1.5倍以上かを見ます。100個が150個になれば1.5倍、120個なら1.2倍です。</p><h3>たくさん売れれば値段も上がる？</h3><p>値引きセールでパンがたくさん売れることもありますね。株も値下がりしながら出来高が増えることがあります。高い棒を見つけたら、株価が上がったか下がったかも見ましょう。</p><h3>比べる時間もそろえよう</h3><p>今朝売れた数と、普段の1日全部の数をそのまま比べると迷いますよね。出来高も、取引が終わった日の値か、まだ取引中の途中の値かを確かめましょう。</p>",
    "combo_title": "なぜ3つ一緒に見るの？",
    "combo_normal": "<h3>3つの質問を組み合わせます</h3><p>MACDでは「勢いが改善しているか」、RSIでは「最近の下落から回復しているか」、出来高では「普段より売買が活発か」を考えます。MACDとRSIはどちらも価格を使うので、完全に独立した証拠ではありません。3条件がそろっても、成功確率が自動的に決まるわけではありません。</p><h3>1銘柄を読む順番 · 架空の例</h3><p>①RSIが28から32に戻ったかを確認。②MACDがシグナルを下から上へ超えたかを確認。③平均100万株に対して180万株なら1.8倍と計算。最後に株価が反発しているか、急落につながるニュースがないかを見ます。これは読み進め方の例であり、シグナルが必ずこの順で出るという意味ではありません。</p><h3>時間軸も合わせましょう</h3><p>日足の1本は1日、週足の1本は1週間です。同じ銘柄でも時間軸によってシグナルは変わります。直近の複数の足を対象にする場合、今日の数値だけでは以前のシグナルを説明できないことがあります。発生した日とデータの基準時刻も確認しましょう。</p><h3>理解できたかチェック</h3><p>RSIは低いだけですか、それとも30を再び超えましたか？ MACDはシグナルを超えましたか、それとも近づいているだけですか？ 出来高の増加は上昇と一緒ですか、下落と一緒ですか？ 3条件がそろっても反発が失敗することはあります。これは実際の銘柄を買う指示ではなく、チャートを読む練習です。</p>",
    "combo_eli5": "<h3>3つの質問をしてみよう</h3><p>「最近の勢いはよくなった？」はMACD、「下がる力から戻ってきた？」はRSI、「普段より売買が多い？」は出来高で見ます。同じ場面を違う道具で観察する感じです。</p><h3>練習してみましょう</h3><p>RSIが28から32に戻り、青いMACD線がオレンジを超え、出来高が普段の1.8倍になったとします。3つの手がかりが集まりました。次は株価も回復しているかを見ます。売買が多くても株価が急落していたら、同じようには読めません。</p><h3>必ず当たる印ではありません</h3><p>3つともよく見えても、翌日に株価が下がることはあります。「3つそろったから絶対成功」と数えるより、それぞれの数字が何を表すか説明できることを目指しましょう。</p>",
    "back_home": "← ダッシュボードホーム",
    "back_table": "実際のシグナルを見る →",

  "en": {
    "break_title": "It’s okay to take a break",
    "break_message": "MACD, RSI, volume… you don’t have to understand it all at once. Rest your eyes for a moment. When you’re ready, read on to see why we look at the three indicators together.",
    "break_alt": "A cat resting on a windowsill beside a warm cup and a potted plant",
    "page_title": "Understanding the Buy-Signal Indicators",
    "h1": "How Are These Signals Made?",
    "sub": "Start with the diagrams, then work through examples. Choose the standard or simple explanation at your own pace.",
    "level_normal": "🎓 Standard explanation",
    "level_eli5": "🧒 Explain it like I’m a kid",

    "macd_title": "① MACD Cross — Spotting Improving Momentum",
    "macd_visual": "The blue MACD line crosses above the orange signal line as the histogram flips positive",
    "macd_normal": "<h3>What does MACD measure?</h3><p>MACD helps you examine whether recent price momentum is strengthening relative to its earlier pace. A moving average smooths price fluctuations; an exponential moving average (EMA) gives more weight to recent prices. A common setup is 12, 26 and 9 periods, though chart settings can vary.</p><h3>Read the two lines and the bars</h3><p>The MACD line is the shorter EMA minus the longer EMA. The signal line is a smoothed average of MACD. The histogram is MACD minus the signal line. A cross above the signal and a histogram change from negative to positive describe the same relationship, rather than two independent confirmations.</p><h3>A worked example · invented values</h3><p>Yesterday, MACD was −0.8 and the signal was −0.6, giving a histogram of −0.2. Today, MACD is −0.3 and the signal is −0.5, giving +0.2. MACD has moved from below the signal to above it. Notice that both lines can still be below zero when this happens.</p><h3>What can you conclude?</h3><p>The crossover is a clue that momentum is improving, not proof that the price has bottomed. Crossing the signal line is different from MACD crossing zero. Averages react after price changes, and sideways markets can produce repeated crossovers that quickly reverse. Check the price path, RSI and volume for context.</p>",
    "macd_eli5": "<h3>Think about running records</h3><p>Imagine comparing a runner’s recent results with their longer-term record. Are the latest results getting better? MACD asks a similar question about price, using averages rather than running times.</p><h3>What should you look for?</h3><p>The blue line is MACD and the orange line is its signal, or comparison line. When blue moves from below orange to above it, we ask whether recent momentum is improving. The bars show the gap between those same two lines.</p><h3>Try a small example</h3><p>Yesterday blue was 0.2 below orange. Today it is 0.2 above orange. Their order has changed: that is an upward crossover. Start by spotting that change rather than trying to memorize every calculation.</p><h3>Remember the limit</h3><p>One better running result does not guarantee a win in the next race. A MACD crossover does not promise a higher stock price either. Look at what the price and the other indicators are doing as well.</p>",
    "rsi_title": "② RSI Rebound — Recovering From Oversold",
    "rsi_visual": "RSI drops below 30, then climbs back above 30",
    "rsi_normal": "<h3>RSI summarizes the strength of price moves</h3><p>RSI compares average upward and downward price changes on a scale from 0 to 100. It does not simply count up days or measure the percentage of people buying. Fourteen periods is a common setting; on a daily chart, each period is a trading day. Different settings can produce different readings.</p><h3>How to read 30 and 70</h3><p>Below 30 is commonly called oversold; above 70 is called overbought. These describe the balance of recent price moves. An RSI of 30 does not mean the stock has fallen 30%, and a low reading does not establish that it is cheap relative to the business’s value.</p><h3>28 → 32 versus 35 → 32 · invented example</h3><p>Suppose RSI reads 28 on Monday, 29 on Tuesday and 32 on Wednesday. It has returned above 30 after being below it: the recovery pattern discussed here. A move from 35 yesterday to 32 today ends at the same number but is not a recovery across 30. Read the path, not just the latest value.</p><h3>Oversold does not mean a bounce is due</h3><p>RSI can stay low during a strong decline, or briefly cross 30 before falling again. It can also remain above 70 during a strong rise. Check whether price is still making new lows, whether a rebound continues, and how volume behaves.</p>",
    "rsi_eli5": "<h3>Imagine a thermometer for price moves</h3><p>RSI uses a 0–100 scale to describe the balance between recent upward and downward moves. Like a thermometer, it helps describe a condition. It does not tell the future.</p><h3>For example: 28 → 29 → 32</h3><p>The reading was below 30 and has come back above it. That gives us a reason to ask whether downward momentum is easing. A fall from 35 to 32 tells a different story. The same final number can come from different directions.</p><h3>It is not a grade or a discount</h3><p>RSI 30 is not a test score, a share price or a 30% discount. It is a number calculated from price changes. A reading above 70 does not automatically make a stock bad, either.</p><h3>Look once more</h3><p>A low reading can stay low. After checking whether RSI has crossed back above 30, look at whether the price is recovering and what the other indicators show.</p>",
    "volume_title": "③ Volume Spike — Unusually Active Trading",
    "volume_visual": "Today’s volume rises to at least 1.5× the recent 20-day average",
    "volume_normal": "<h3>Volume counts shares traded</h3><p>If one million shares change hands in a day, daily volume is one million shares. That is different from the money traded or the number of traders. Shares can trade repeatedly, and every completed trade has both a buyer and a seller. Higher volume alone does not mean only buying has increased.</p><h3>Compare it with a baseline</h3><p>The volume ratio is the volume for the period divided by the reference average. This guide uses at least 1.5 times the recent 20-day average as its threshold. That is a rule used here, not a universal cutoff that works for every stock.</p><h3>One million → 1.8 million · invented example</h3><p>With a baseline of one million shares and today’s volume of 1.8 million, the ratio is 1.8 ÷ 1 = 1.8×. That is 80% above average and exceeds 1.5×. Volume of 1.2 million would be 1.2× and below the threshold. Note that 1.5× means a 50% increase, not a 150% increase.</p><h3>Check direction and timing</h3><p>Heavy trading during a price rise means something different from heavy trading during a sharp fall. A one-off event such as an earnings release may also explain it. Intraday volume is not yet a full day’s total, so check the timestamp when comparing it with a daily average. A tall bar does not establish an upward direction.</p>",
    "volume_eli5": "<h3>Think of bread sold at a shop</h3><p>If a shop normally sells 100 rolls a day and sells 180 today, activity is unusually high. Volume similarly counts shares traded. It is not a count of the people visiting the shop.</p><h3>Work out the multiple</h3><p>180 ÷ 100 = 1.8 times the usual amount. This guide looks for at least 1.5 times the average. Selling 150 instead of 100 gives 1.5×; selling 120 gives 1.2×.</p><h3>Does more activity mean a higher price?</h3><p>The shop might sell more bread because it lowered its prices. Stocks can also trade heavily while prices fall. After spotting a tall volume bar, check whether the price went up or down.</p><h3>Compare matching times</h3><p>Comparing this morning’s sales with a normal full day can be misleading. For shares too, check whether you are looking at a completed day or a total that is still growing during the session.</p>",
    "combo_title": "Why look at all 3 together?",
    "combo_normal": "<h3>Bring three questions together</h3><p>MACD helps ask whether momentum is improving, RSI whether price is recovering from recent downward pressure, and volume whether trading is unusually active. MACD and RSI both use price data, so they are not fully independent evidence. Meeting all three conditions does not give you an automatic probability of success.</p><h3>A reading sequence · invented example</h3><p>First, check whether RSI moved from 28 to 32. Next, check whether MACD crossed above its signal. Then calculate whether 1.8 million shares against a one-million baseline gives 1.8× volume. Finally, inspect the price rebound and any news behind the move. This is an example of how to read the data, not a required order in which signals must occur.</p><h3>Match the timeframe</h3><p>One bar on a daily chart represents a day; one on a weekly chart represents a week. Signals can differ across these timeframes. When signals are checked over several recent bars, today’s values alone may not explain an earlier signal. Check the signal date and the data timestamp.</p><h3>Test your understanding</h3><p>Is RSI merely low, or has it returned above 30? Has MACD crossed its signal, or is it only approaching it? Is heavier volume accompanying a rise or a fall? A rebound can still fail when all three conditions appear. These examples are reading exercises, not instructions to buy an actual stock.</p>",
    "combo_eli5": "<h3>Ask three questions</h3><p>Is recent momentum improving? Look at MACD. Is it recovering from downward pressure? Look at RSI. Is trading busier than usual? Look at volume. Think of different tools for observing the same scene.</p><h3>Let’s practice</h3><p>Imagine RSI moves from 28 to 32, blue MACD crosses above orange, and volume reaches 1.8 times its average. Three clues have appeared. Now look at whether price is actually recovering. Heavy trading during a sharp fall tells a different story.</p><h3>There is no guaranteed answer</h3><p>Even if all three look encouraging, the price could fall tomorrow. Instead of adding up three clues and calling it a certain success, aim to explain what each clue tells you.</p>",
