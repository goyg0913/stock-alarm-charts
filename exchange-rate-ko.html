<style>
  * { box-sizing:border-box; }
  body { margin:0; padding:18px 16px 40px; color:#1a1a1a; background:#fff;
         font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',
                     'Apple SD Gothic Neo','Malgun Gothic',
                     'Hiragino Sans','Yu Gothic',sans-serif; }
  .wrap { max-width:480px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 2px; font-weight:800; }
  .sub { font-size:12.5px; color:#888; margin-bottom:14px; }
  .disclaimer { display:flex; align-items:flex-start; gap:8px; margin:0 0 16px;
    padding:11px 13px; border-radius:12px; background:#fff8e1; border:1.5px solid #ffd54f;
    color:#7a5c00; font-size:12px; font-weight:700; line-height:1.5; }
  .rate-card { border-radius:16px; padding:16px 18px; margin-bottom:12px;
               border:1px solid #e9e9ee; box-shadow:0 2px 10px rgba(0,0,0,.04); }
  .rate-card.usd { background:linear-gradient(135deg,#f0f6ff,#fff); }
  .rate-card.jpy { background:linear-gradient(135deg,#fff0f7,#fff); }
  .rate-card .name { font-size:13.5px; font-weight:700; color:#444; display:flex; align-items:center; gap:6px; }
  .rate-card .pair { font-size:11.5px; color:#999; margin:2px 0 8px; }
  .rate-card .value-row { display:flex; align-items:baseline; gap:6px; }
  .rate-card .value { font-size:28px; font-weight:800; font-variant-numeric:tabular-nums; }
  .rate-card .unit { font-size:13px; color:#888; font-weight:600; }
  .status-bar { display:flex; justify-content:space-between; align-items:center;
                margin:14px 0 18px; font-size:11.5px; color:#999; }
  .status-bar .dot { display:inline-block; width:7px; height:7px; border-radius:50%;
                      background:#2ea043; margin-right:5px; }
  .status-bar .dot.loading { background:#ffb020; animation:pulse 1s infinite; }
  .status-bar .dot.error { background:#e5484d; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .credit a { color:#aaa; }

<body>
  <div class="wrap">
    <h1>환율 정보 · 실시간 갱신</h1>
    <div class="sub">1분마다 자동으로 최신 환율을 불러옵니다</div>

    <div class="disclaimer"><span>⚠️</span><span>본 환율은 참고용 시장 지표이며 실제 은행·환전소 고시 환율과 차이가 있을 수 있습니다. 최종 거래는 반드시 금융기관에서 확인하세요.</span></div>

    <div class="rate-card usd">
      <div class="name">🇺🇸 미국 달러</div>
      <div class="pair">USD → KRW · 1달러 기준</div>
      <div class="value-row"><span class="value" id="usd-krw">—</span><span class="unit">원</span></div>
    </div>

    <div class="rate-card jpy">
      <div class="name">🇯🇵 일본 엔</div>
      <div class="pair">JPY → KRW · 100엔 기준</div>
      <div class="value-row"><span class="value" id="jpy-krw">—</span><span class="unit">원</span></div>
    </div>

    <div class="status-bar">
      <span><i class="dot loading" id="status-dot"></i><span id="status-text">불러오는 중…</span></span>
      <span id="updated-at"></span>
    </div>

    <div class="credit">환율 제공: <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">ExchangeRate-API</a></div>

    <div class="nav">
      <a href="index.html">← 대시보드 홈</a>
      <a href="sp500_table.html">전체 종목 표 보기 →</a>
    </div>
    <div class="other-langs">다른 언어로 보기: <a href="exchange-rate-ja.html">日本語</a> · <a href="exchange-rate-en.html">English</a></div>
  </div>

<script>
(function () {
  var API_URL = "https://open.er-api.com/v6/latest/USD";
  var REFRESH_MS = 60000;

  var usdEl = document.getElementById("usd-krw");
  var jpyEl = document.getElementById("jpy-krw");
  var dotEl = document.getElementById("status-dot");
  var statusEl = document.getElementById("status-text");
  var updatedEl = document.getElementById("updated-at");

  function fmt(n) {
    return n.toLocaleString("ko-KR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function setStatus(kind, text) {
    dotEl.className = "dot" + (kind ? " " + kind : "");
    statusEl.textContent = text;
  }

  function load() {
    setStatus("loading", "불러오는 중…");
    fetch(API_URL, { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        if (data.result !== "success" || !data.rates || !data.rates.KRW || !data.rates.JPY) {
          throw new Error("bad payload");
        }
        var krwPerUsd = data.rates.KRW;
        var krwPer100Jpy = (data.rates.KRW / data.rates.JPY) * 100;
        usdEl.textContent = fmt(krwPerUsd);
        jpyEl.textContent = fmt(krwPer100Jpy);
        updatedEl.textContent = "업데이트 " + new Date().toLocaleTimeString("ko-KR");
        setStatus("", "실시간 갱신 중 (1분 간격)");
      })
      .catch(function () {
        setStatus("error", "환율을 불러오지 못했습니다. 잠시 후 다시 시도합니다.");
      });
  }

  load();
  setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>
