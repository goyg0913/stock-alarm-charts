<style>
  :root {
    --blue:#3E6AE1; --white:#FFFFFF; --carbon:#171A20; --graphite:#393C41;
    --pewter:#5C5E62; --silver-fog:#8E8E8E; --pale-silver:#D0D1D2; --light-ash:#F4F4F4;
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:18px 16px 40px; color:var(--graphite); background:var(--white);
         font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,
                     'Apple SD Gothic Neo','Malgun Gothic',
                     'Hiragino Sans','Yu Gothic',sans-serif; }
  .wrap { max-width:480px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 2px; font-weight:500; color:var(--carbon); }
  .sub { font-size:12.5px; color:var(--pewter); margin-bottom:14px; }
  .disclaimer { display:flex; align-items:flex-start; gap:8px; margin:0 0 16px;
    padding:12px 0; background:var(--white);
    color:var(--carbon); font-size:12px; font-weight:500; line-height:1.5; }
  .rate-card { border-radius:0; padding:20px; margin-bottom:24px; background:var(--light-ash); }
  .rate-card .name { font-size:13.5px; font-weight:500; color:var(--carbon); display:flex; align-items:center; gap:6px; }
  .rate-card .pair { font-size:11.5px; color:var(--pewter); margin:2px 0 8px; }
  .rate-card .value-row { display:flex; align-items:baseline; gap:6px; }
  .rate-card .value { font-size:28px; font-weight:500; font-variant-numeric:tabular-nums; color:var(--blue); }
  .rate-card .unit { font-size:13px; color:var(--pewter); font-weight:500; }
  .status-bar { display:flex; justify-content:space-between; align-items:center;
                margin:14px 0 18px; font-size:11.5px; color:var(--pewter); }
  .status-bar .dot { display:inline-block; width:7px; height:7px; border-radius:50%;
                      background:var(--carbon); margin-right:5px; }
  .status-bar .dot.loading { background:var(--silver-fog); animation:pulse 1s infinite; }
  .status-bar .dot.error { background:var(--pewter); }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .credit { font-size:11px; color:var(--silver-fog); margin-bottom:18px; }
  .credit a { color:var(--pewter); }
  .nav { margin-top:22px; font-size:12.5px; display:flex; justify-content:space-between; }
  .nav a { color:var(--blue); text-decoration:none; }
  .other-langs { margin-top:8px; font-size:11.5px; color:var(--silver-fog); }
  .other-langs a { color:var(--pewter); }
</style>

<body>
  <div class="wrap">
    <h1>ドル・円の為替</h1>
    <div class="sub">1米ドルと100円の韓国ウォン換算額を確認できます。</div>

    <div class="disclaimer"><span>⚠️</span><span>提供された為替レートによる参考額です。銀行や両替所の適用レートや手数料とは異なる場合があります。</span></div>

    <div class="rate-card usd">
      <div class="name">🇺🇸 米ドル</div>
      <div class="pair">USD → KRW ・ 1ドルあたり</div>
      <div class="value-row"><span class="value" id="usd-krw">—</span><span class="unit">ウォン</span></div>
    </div>

    <div class="rate-card jpy">
      <div class="name">🇯🇵 日本円</div>
      <div class="pair">JPY → KRW ・ 100円あたり</div>
      <div class="value-row"><span class="value" id="jpy-krw">—</span><span class="unit">ウォン</span></div>
    </div>

    <div class="status-bar">
      <span><i class="dot loading" id="status-dot"></i><span id="status-text">読み込み中…</span></span>
      <span id="updated-at"></span>
    </div>

    <div class="credit">為替提供: <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">ExchangeRate-API</a></div>

    <div class="nav">
      <a href="index.html">← ダッシュボードホーム</a>
      <a href="sp500_table.html">全銘柄の表を見る →</a>
    </div>
    <div class="other-langs">他の言語で見る: <a href="exchange-rate-ko.html">한국어</a> · <a href="exchange-rate-en.html">English</a></div>
  </div>

<script>
(function () {
  var API_URL = "https://open.er-api.com/v6/latest/USD";
  var REFRESH_MS = 60000;

  var usdEl = document.getElementById("usd-krw");
  var jpyEl = document.getElementById("jpy-krw");
  var dotEl = document.getElementById("status-dot");
  var statusEl = document.getElementById("status-text");
  var updatedEl = document.getElementById("updated-at");

  function fmt(n) {
    return n.toLocaleString("ja-JP", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function setStatus(kind, text) {
    dotEl.className = "dot" + (kind ? " " + kind : "");
    statusEl.textContent = text;
  }

  function load() {
    setStatus("loading", "読み込み中…");
    fetch(API_URL, { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        if (data.result !== "success" || !data.rates || !data.rates.KRW || !data.rates.JPY) {
          throw new Error("bad payload");
        }
        var krwPerUsd = data.rates.KRW;
        var krwPer100Jpy = (data.rates.KRW / data.rates.JPY) * 100;
        usdEl.textContent = fmt(krwPerUsd);
        jpyEl.textContent = fmt(krwPer100Jpy);
        updatedEl.textContent = "確認時刻 " + new Date().toLocaleTimeString("ja-JP");
        setStatus("", "リアルタイム更新中(1分間隔)");
      })
      .catch(function () {
        setStatus("error", "為替レートを取得できませんでした。しばらくして再試行します。");
      });
  }

  load();
  setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>
