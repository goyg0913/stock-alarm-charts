<style>
  :root {
    --blue:#3E6AE1; --white:#FFFFFF; --carbon:#171A20; --graphite:#393C41;
    --pewter:#5C5E62; --silver-fog:#8E8E8E; --pale-silver:#D0D1D2; --light-ash:#F4F4F4;
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:18px 16px 40px; color:var(--graphite); background:var(--white);
         font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,
                     'Apple SD Gothic Neo','Malgun Gothic',
                     'Hiragino Sans','Yu Gothic',sans-serif; }
  .wrap { max-width:480px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 2px; font-weight:500; color:var(--carbon); }
  .sub { font-size:12.5px; color:var(--pewter); margin-bottom:14px; }
  .disclaimer { display:flex; align-items:flex-start; gap:8px; margin:0 0 16px;
    padding:12px 14px; border-radius:12px; background:var(--light-ash);
    color:var(--carbon); font-size:12px; font-weight:500; line-height:1.5; }
  .summary-card { border-radius:12px; padding:20px; margin-bottom:14px; background:var(--light-ash); }
  .summary-card .invested { font-size:12px; color:var(--pewter); margin-bottom:2px; }
  .summary-card .invested b { color:var(--carbon); font-weight:500; font-variant-numeric:tabular-nums; }
  .summary-card .headline { font-size:12.5px; color:var(--pewter); margin:6px 0 2px; }
  .summary-card .headline-value { font-size:28px; font-weight:500; font-variant-numeric:tabular-nums; color:var(--blue); }
  .summary-card .headline-value .per { font-size:13px; color:var(--pewter); font-weight:400; margin-left:4px; }
  .status-bar { display:flex; justify-content:space-between; align-items:center;
                margin:10px 0 18px; font-size:11.5px; color:var(--pewter); }
  .status-bar .dot { display:inline-block; width:7px; height:7px; border-radius:50%;
                      background:#2ea043; margin-right:5px; }
  .status-bar .dot.idle { background:var(--pale-silver); }
  .status-bar .dot.loading { background:#ffb020; animation:pulse 1s infinite; }
  .status-bar .dot.error { background:#e5484d; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.35;} }

  label { display:block; font-size:11.5px; font-weight:500; color:var(--pewter); margin:0 0 4px; }
  .field { margin-bottom:10px; }
  .row2 { display:flex; gap:10px; }
  .row2 .field { flex:1; }
  input[type=text], input[type=number] {
    width:100%; font-size:14px; padding:10px 12px; border-radius:4px;
    border:1px solid var(--pale-silver); font-family:inherit; color:var(--carbon); }
  input::placeholder { color:var(--silver-fog); }
  input:focus { outline:none; border-color:var(--blue); }
  button { font-family:inherit; cursor:pointer; border-radius:4px; font-weight:500; font-size:13.5px; padding:11px;
           border:3px solid transparent; box-shadow:rgba(0,0,0,0) 0 0 0 2px inset;
           transition:border-color .33s,background-color .33s,color .33s,box-shadow .25s; }
  button.primary { width:100%; background:var(--blue); color:var(--white); margin-bottom:18px; }
  button.primary:hover { background:#3459c4; }
  button:disabled { opacity:.5; cursor:not-allowed; }

  .holdings h2 { font-size:14px; margin:0 0 10px; font-weight:500; color:var(--carbon);
                 display:flex; justify-content:space-between; align-items:center; }
  .holdings h2 button { font-size:11px; padding:6px 12px; border-radius:4px; border:1px solid var(--pale-silver);
                         background:var(--white); color:var(--pewter); font-weight:500; }
  .holding-item { padding:16px 18px; border-radius:12px; margin-bottom:10px; background:var(--light-ash); }
  .holding-item .top-row { display:flex; justify-content:space-between; align-items:flex-start; }
  .holding-item .ticker { font-size:14px; font-weight:500; color:var(--carbon); }
  .holding-item .del { color:var(--pewter); background:none; border:none; font-size:17px; padding:2px 4px; box-shadow:none; }
  .holding-item .monthly { font-size:18px; font-weight:500; color:var(--blue); font-variant-numeric:tabular-nums; margin:4px 0 8px; }
  .holding-item .monthly .per { font-size:11px; color:var(--pewter); font-weight:400; }
  .holding-item table.detail { width:100%; border-collapse:collapse; font-size:12px; }
  .holding-item table.detail td { padding:3px 0; color:var(--pewter); }
  .holding-item table.detail td.val { text-align:right; font-variant-numeric:tabular-nums; font-weight:500; color:var(--carbon); }
  .holding-item .err { font-size:12px; color:#c0392b; font-weight:500; margin-top:4px; }
  .holding-item .loading-label { font-size:12px; color:var(--pewter); font-weight:500; margin-top:4px; }
  .holdings-empty { font-size:12px; color:var(--silver-fog); padding:10px 0 20px; text-align:center; }

  .credit { font-size:11px; color:var(--silver-fog); margin:14px 0 18px; }
  .credit a { color:var(--pewter); }
  .nav { margin-top:22px; font-size:12.5px; display:flex; justify-content:space-between; }
  .nav a { color:var(--blue); text-decoration:none; }
  .other-langs { margin-top:8px; font-size:11.5px; color:var(--silver-fog); }
  .other-langs a { color:var(--pewter); }
</style>

<body>
  <div class="wrap">
    <h1>配当金を計算する</h1>
    <div class="sub">保有銘柄と株数を入力すると、直近12か月の配当をもとに月平均額を計算できます。</div>

    <div class="disclaimer"><span>⚠️</span><span>月平均額は直近12か月の配当を12で割った税引前の推計です。実際の月別支払額とは異なり、今後の配当や税金により受取額は変わります。</span></div>

    <div class="summary-card">
      <div class="invested">評価金額合計 <b id="total-invested">$0.00</b></div>
      <div class="headline">月平均配当金（税引前）</div>
      <div class="headline-value" id="total-monthly">$0.00</div>
    </div>

    <div class="status-bar">
      <span><i class="dot idle" id="status-dot"></i><span id="status-text">保有銘柄を追加して配当金を確認できます</span></span>
      <span id="updated-at"></span>
    </div>

    <div class="field">
      <label for="ticker">ティッカー（例: SCHD, AAPL, KO, JEPI）</label>
      <input type="text" id="ticker" placeholder="SCHD" autocomplete="off" autocapitalize="characters">
    </div>
    <div class="row2">
      <div class="field">
        <label for="shares">保有株数</label>
        <input type="number" id="shares" placeholder="10" min="0" step="0.0001">
      </div>
    </div>
    <button type="button" class="primary" id="add-btn">銘柄を追加</button>

    <div class="holdings">
      <h2>構成銘柄<button type="button" id="clear-all-btn">全て削除</button></h2>
      <div id="holdings-list"></div>
    </div>

    <div class="credit">株価・配当データ：Yahoo Finance。銘柄によりデータの基準時点が異なる場合があります。</div>

    <div class="nav">
      <a href="index.html">← ダッシュボードホーム</a>
      <a href="exchange-rate-ja.html">ドル・円の為替 →</a>
    </div>
    <div class="other-langs">他の言語で見る: <a href="dividend-simulator-ko.html">한국어</a> · <a href="dividend-simulator-en.html">English</a></div>
  </div>

<script>
(function () {
  var DIVIDEND_DB_URL = "dividends.json";
  var STORAGE_KEY = "sa_dividend_portfolio";

  var tickerEl = document.getElementById("ticker");
  var sharesEl = document.getElementById("shares");
  var addBtn = document.getElementById("add-btn");
  var clearAllBtn = document.getElementById("clear-all-btn");
  var dotEl = document.getElementById("status-dot");
  var statusEl = document.getElementById("status-text");
  var updatedEl = document.getElementById("updated-at");
  var totalInvestedEl = document.getElementById("total-invested");
  var totalMonthlyEl = document.getElementById("total-monthly");
  var holdingsList = document.getElementById("holdings-list");

  var holdings = [];
  var dbPromise = null;

  function usd(n) {
    if (!isFinite(n)) n = 0;
    return "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function setStatus(kind, text) {
    dotEl.className = "dot" + (kind ? " " + kind : "");
    statusEl.textContent = text;
  }

  function loadPortfolio() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) { return []; }
  }

  // 入力したティッカー・株数だけを保存する。価格・配当の値はローカルに
  // キャッシュせず、毎回この訪問で新しく取得したDBから再計算する。
  function savePortfolio() {
    try {
      var slim = holdings.map(function (h) {
        return { id: h.id, ticker: h.ticker, shares: h.shares };
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(slim));
    } catch (e) {}
  }

  // dividends.jsonはページ訪問時に1回だけ取得し、以降の全銘柄照会に
  // 再利用する — 1分ごとの再取得はせず、Yahoo Financeを公開CORSプロキシ
  // 経由で呼び出すライブフォールバックも行わない。本日分のDBに無い銘柄は
  // 「見つかりません」として扱う。
  function loadDb() {
    if (!dbPromise) {
      dbPromise = fetch(DIVIDEND_DB_URL, { cache: "no-store" }).then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      });
    }
    return dbPromise;
  }

  function fetchQuote(ticker) {
    return loadDb().then(function (db) {
      var entry = db && db.tickers && db.tickers[ticker.toUpperCase()];
      if (!entry) throw new Error("not_in_db");
      // stock-apiのJSON契約はsnake_case(ttm_dividend)。一部の銘柄はバッチが
      // まだ新スキーマで上書きしておらず、以前のcamelCaseキーのままの場合が
      // あるため両方を確認する。
      var ttm = entry.ttm_dividend != null ? entry.ttm_dividend : entry.ttmDividend;
      return {
        symbol: entry.symbol || ticker.toUpperCase(),
        currency: entry.currency || "USD",
        price: entry.price || 0,
        ttmDividend: ttm || 0
      };
    });
  }

  function fxRateToUSD(currency) {
    if (currency === "USD") return Promise.resolve(1);
    return fetch("https://open.er-api.com/v6/latest/" + currency, { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      }).then(function (json) {
        if (json.result !== "success" || !json.rates || !json.rates.USD) throw new Error("為替取得失敗");
        return json.rates.USD;
      });
  }

  function renderTotals() {
    var totalInvested = 0, totalMonthly = 0;
    holdings.forEach(function (h) {
      if (h.hasData) totalInvested += h.marketValueUSD || 0;
      if (h.annualDividendUSD) totalMonthly += h.annualDividendUSD / 12;
    });
    totalInvestedEl.textContent = usd(totalInvested);
    totalMonthlyEl.innerHTML = usd(totalMonthly);
  }

  function renderHoldings() {
    holdingsList.innerHTML = "";
    if (holdings.length === 0) {
      holdingsList.innerHTML = '<div class="holdings-empty">まだ銘柄がありません。上でティッカーと保有株数を入力してください。</div>';
      renderTotals();
      return;
    }
    holdings.forEach(function (h) {
      var item = document.createElement("div");
      item.className = "holding-item";

      var body = '<div class="top-row"><span class="ticker"></span>' +
        '<button type="button" class="del" aria-label="削除">✕</button></div>';

      if (h.error && !h.hasData) {
        body += '<div class="err"></div>';
      } else if (h.loading && !h.hasData) {
        body += '<div class="loading-label">読み込み中…</div>';
      } else if (h.hasData) {
        body += '<div class="monthly"><span class="monthly-val"></span><span class="per"> /月平均（税引前）</span></div>' +
          '<table class="detail">' +
          '<tr><td>保有株数</td><td class="val shares-val"></td></tr>' +
          '<tr><td>現在価格</td><td class="val price-val"></td></tr>' +
          '<tr><td>評価金額</td><td class="val invested-val"></td></tr>' +
          '<tr><td>1株配当金（直近12か月）</td><td class="val dps-val"></td></tr>' +
          '<tr><td>予想年間配当金</td><td class="val annual-val"></td></tr>' +
          '</table>';
        if (h.error) body += '<div class="err"></div>';
      }

      item.innerHTML = body;
      item.querySelector(".ticker").textContent = h.ticker;
      item.querySelector(".del").addEventListener("click", function () {
        holdings = holdings.filter(function (x) { return x.id !== h.id; });
        savePortfolio();
        renderHoldings();
      });

      if (h.hasData) {
        item.querySelector(".monthly-val").textContent = usd(h.annualDividendUSD / 12);
        item.querySelector(".shares-val").textContent = h.shares.toLocaleString("en-US", { maximumFractionDigits: 4 });
        item.querySelector(".price-val").textContent = usd(h.priceUSD);
        item.querySelector(".invested-val").textContent = usd(h.marketValueUSD);
        item.querySelector(".dps-val").textContent = usd(h.dividendPerShareUSD);
        item.querySelector(".annual-val").textContent = usd(h.annualDividendUSD);
      }
      if (h.error) {
        item.querySelector(".err").textContent = "⚠ " + h.error;
      }

      holdingsList.appendChild(item);
    });
    renderTotals();
  }

  function refreshHolding(h) {
    h.loading = true;
    return fetchQuote(h.ticker).then(function (data) {
      return fxRateToUSD(data.currency).then(function (rate) {
        var priceUSD = data.price * rate;
        var dividendPerShareUSD = data.ttmDividend * rate;
        h.priceUSD = priceUSD;
        h.dividendPerShareUSD = dividendPerShareUSD;
        h.marketValueUSD = priceUSD * h.shares;
        h.annualDividendUSD = dividendPerShareUSD * h.shares;
        h.hasData = true;
        h.error = null;
        h.loading = false;
      });
    }).catch(function (err) {
      h.loading = false;
      h.error = (err && err.message === "not_in_db")
        ? "この銘柄は本日の配当データにありません。銘柄コードをご確認ください。"
        : "銘柄情報を取得できませんでした。銘柄コードを確認するか、しばらくしてから再度お試しください。";
    });
  }

  function refreshAll() {
    if (holdings.length === 0) {
      setStatus("idle", "保有銘柄を追加して配当金を確認できます");
      return;
    }
    setStatus("loading", "読み込み中…");
    renderHoldings();
    Promise.all(holdings.map(refreshHolding)).then(function () {
      renderHoldings();
      var anyError = holdings.some(function (h) { return h.error; });
      updatedEl.textContent = "確認時刻 " + new Date().toLocaleTimeString("ja-JP");
      setStatus(anyError ? "error" : "", anyError ? "一部の銘柄の取得に失敗（下記参照）" : "配当金の計算が完了しました");
    });
  }

  function addHolding() {
    var ticker = tickerEl.value.trim().toUpperCase();
    var shares = parseFloat(sharesEl.value);
    if (!ticker) { tickerEl.focus(); return; }
    if (!shares || shares <= 0) { sharesEl.focus(); return; }

    var h = {
      id: Date.now() + "-" + Math.random().toString(36).slice(2, 8),
      ticker: ticker,
      shares: shares,
      hasData: false,
      loading: false,
      error: null
    };
    holdings.push(h);
    savePortfolio();
    tickerEl.value = "";
    sharesEl.value = "";
    renderHoldings();

    setStatus("loading", "読み込み中…");
    refreshHolding(h).then(function () {
      renderHoldings();
      updatedEl.textContent = "確認時刻 " + new Date().toLocaleTimeString("ja-JP");
      setStatus(h.error ? "error" : "", h.error ? "取得失敗（下記参照）" : "配当金の計算が完了しました");
    });
  }

  addBtn.addEventListener("click", addHolding);
  tickerEl.addEventListener("keydown", function (e) { if (e.key === "Enter") sharesEl.focus(); });
  sharesEl.addEventListener("keydown", function (e) { if (e.key === "Enter") addHolding(); });

  clearAllBtn.addEventListener("click", function () {
    if (holdings.length === 0) return;
    if (!confirm("保有銘柄を全て削除しますか？")) return;
    holdings = [];
    savePortfolio();
    renderHoldings();
    setStatus("idle", "保有銘柄を追加して配当金を確認できます");
  });

  // 保存されたティッカー・株数だけを復元し、値はこの訪問で取得したDBから
  // 全て再計算する — 以前計算した値をそのまま残すことはしない。
  var saved = loadPortfolio();
  holdings = saved.map(function (s) {
    return {
      id: s.id,
      ticker: s.ticker,
      shares: s.shares || 0,
      hasData: false,
      loading: false,
      error: null
    };
  });
  renderHoldings();
  if (holdings.length > 0) refreshAll();
})();
</script>
</body>
</html>
