<style>

  input[type=text], input[type=number] {
    width:100%; font-size:14px; padding:10px 12px; border-radius:10px;

  .holdings h2 { font-size:14px; margin:0 0 10px; display:flex; justify-content:space-between; align-items:center; }
  .holdings h2 button { font-size:11px; padding:5px 9px; border-radius:999px; border:1px solid #e2e6eb; background:#f7f7f9; color:#888; font-weight:600; }

<body>
  <div class="wrap">
    <h1>配当金を計算する</h1>
    <div class="sub">保有銘柄と株数を入力すると、直近12か月の配当をもとに月平均額を計算できます。</div>

    <div class="disclaimer"><span>⚠️</span><span>月平均額は直近12か月の配当を12で割った税引前の推計です。実際の月別支払額とは異なり、今後の配当や税金により受取額は変わります。</span></div>

    <div class="summary-card">
      <div class="invested">評価金額合計 <b id="total-invested">$0.00</b></div>
      <div class="headline">月平均配当金（税引前）</div>
      <div class="headline-value" id="total-monthly">$0.00</div>
    </div>

    <div class="status-bar">
      <span><i class="dot idle" id="status-dot"></i><span id="status-text">保有銘柄を追加して配当金を確認できます</span></span>
      <span id="updated-at"></span>
    </div>
    <div class="progress-track" id="global-progress" hidden><div class="bar"></div></div>

    <div class="field">
      <label for="ticker">ティッカー（例: SCHD, AAPL, KO, JEPI）</label>
      <input type="text" id="ticker" placeholder="SCHD" autocomplete="off" autocapitalize="characters">
    </div>
    <div class="row2">
      <div class="field">
        <label for="shares">保有株数</label>
        <input type="number" id="shares" placeholder="10" min="0" step="0.0001">
      </div>
    </div>
    <button type="button" class="primary" id="add-btn">銘柄を追加</button>

    <div class="holdings">
      <h2>構成銘柄<button type="button" id="clear-all-btn">全て削除</button></h2>
      <div id="holdings-list"></div>
    </div>

    <div class="credit">株価・配当データ：Yahoo Finance。銘柄によりデータの基準時点が異なる場合があります。</div>

    <div class="nav">
      <a href="index.html">← ダッシュボードホーム</a>
      <a href="exchange-rate-ja.html">ドル・円の為替 →</a>
    </div>
    <div class="other-langs">他の言語で見る: <a href="dividend-simulator-ko.html">한국어</a> · <a href="dividend-simulator-en.html">English</a></div>
  </div>

<script>
(function () {
  var YF_BASE = "https://query1.finance.yahoo.com/v8/finance/chart/";
  // Yahoo Financeはこのページのドメインからの直接ブラウザリクエストに
  // CORSヘッダーを返さないため、CORSプロキシ経由で呼び出す。
  var PROXIES = [
    function (target) { return "https://api.allorigins.win/raw?url=" + encodeURIComponent(target); },
    function (target) { return "https://corsproxy.io/?url=" + encodeURIComponent(target); },
    function (target) { return target; }
  ];
  var DIVIDEND_DB_URL = "dividends.json";
  var DB_MAX_AGE_MS = 2 * 24 * 60 * 60 * 1000; // 2日
  var REFRESH_MS = 60000;
  var STORAGE_KEY = "sa_dividend_portfolio";

  var tickerEl = document.getElementById("ticker");
  var sharesEl = document.getElementById("shares");
  var addBtn = document.getElementById("add-btn");
  var clearAllBtn = document.getElementById("clear-all-btn");
  var dotEl = document.getElementById("status-dot");
  var statusEl = document.getElementById("status-text");
  var updatedEl = document.getElementById("updated-at");
  var totalInvestedEl = document.getElementById("total-invested");
  var totalMonthlyEl = document.getElementById("total-monthly");
  var holdingsList = document.getElementById("holdings-list");
  var globalProgressEl = document.getElementById("global-progress");

  var holdings = [];
  var timer = null;
  var dbPromise = null;

  function usd(n) {
    if (!isFinite(n)) n = 0;
    return "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function setStatus(kind, text) {
    dotEl.className = "dot" + (kind ? " " + kind : "");
    statusEl.textContent = text;
  }

  function loadPortfolio() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) { return []; }
  }

  function savePortfolio() {
    try {
      var slim = holdings.map(function (h) {
        return {
          id: h.id,
          ticker: h.ticker,
          shares: h.shares,
          hasData: h.hasData,
          priceUSD: h.priceUSD,
          dividendPerShareUSD: h.dividendPerShareUSD,
          marketValueUSD: h.marketValueUSD,
          annualDividendUSD: h.annualDividendUSD,
          cachedAt: h.hasData ? Date.now() : null
        };
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(slim));
    } catch (e) {}
  }

  function fetchQuoteLive(ticker) {
    var target = YF_BASE + encodeURIComponent(ticker) + "?range=1y&interval=1mo&events=div";
    function tryProxy(i) {
      if (i >= PROXIES.length) {
        return Promise.reject(new Error("データソースに接続できません（ネットワーク/CORS）"));
      }
      var url = PROXIES[i](target);
      return fetch(url, { cache: "no-store" }).then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      }).then(function (json) {
        var chart = json.chart || {};
        if (chart.error) throw new Error(chart.error.description || "ティッカーが見つかりません");
        var result = chart.result && chart.result[0];
        if (!result || !result.meta) throw new Error("データが見つかりません");
        var meta = result.meta;
        var events = (result.events && result.events.dividends) || {};
        var oneYearAgo = Date.now() / 1000 - 365 * 24 * 3600;
        var ttmDividend = 0;
        Object.keys(events).forEach(function (key) {
          var ev = events[key];
          if (ev.date >= oneYearAgo) ttmDividend += ev.amount;
        });
        return {
          symbol: (meta.symbol || ticker).toUpperCase(),
          currency: meta.currency || "USD",
          price: meta.regularMarketPrice || 0,
          ttmDividend: ttmDividend
        };
      }).catch(function (err) {
        console.error("[dividend-simulator] proxy " + i + " failed for " + ticker + ":", err);
        if (i + 1 < PROXIES.length) return tryProxy(i + 1);
        throw err;
      });
    }
    return tryProxy(0);
  }

  function loadDb(forceRefresh) {
    if (!dbPromise || forceRefresh) {
      dbPromise = fetch(DIVIDEND_DB_URL + "?v=" + Date.now(), { cache: "no-store" })
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .catch(function (err) {
          console.warn("[dividend-simulator] local DB fetch failed, falling back to live for all tickers", err);
          return null;
        });
    }
    return dbPromise;
  }

  // ローカルDB（バッチで毎日更新されるdividends.json）を先に確認し、
  // ティッカーが無い、または古い（2日以上）場合はリアルタイム取得にフォールバックする。
  function fetchQuote(ticker, onSourceKnown) {
    return loadDb().then(function (db) {
      var entry = db && db.tickers && db.tickers[ticker.toUpperCase()];
      var isFresh = !!(db && db.generatedAt && (Date.now() - new Date(db.generatedAt).getTime() < DB_MAX_AGE_MS));
      if (entry && isFresh) {
        if (onSourceKnown) onSourceKnown("db");
        return {
          symbol: entry.symbol || ticker.toUpperCase(),
          currency: entry.currency || "USD",
          price: entry.price || 0,
          ttmDividend: entry.ttmDividend || 0
        };
      }
      if (onSourceKnown) onSourceKnown("live");
      return fetchQuoteLive(ticker);
    });
  }

  function fxRateToUSD(currency) {
    if (currency === "USD") return Promise.resolve(1);
    return fetch("https://open.er-api.com/v6/latest/" + currency, { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      }).then(function (json) {
        if (json.result !== "success" || !json.rates || !json.rates.USD) throw new Error("為替取得失敗");
        return json.rates.USD;
      });
  }

  function renderTotals() {
    var totalInvested = 0, totalMonthly = 0;
    holdings.forEach(function (h) {
      if (h.hasData) totalInvested += h.marketValueUSD || 0;
      if (h.annualDividendUSD) totalMonthly += h.annualDividendUSD / 12;
    });
    totalInvestedEl.textContent = usd(totalInvested);
    totalMonthlyEl.innerHTML = usd(totalMonthly);
  }

  function updateGlobalProgress() {
    var anyLive = holdings.some(function (h) { return h.loading && h.loadingSource === "live"; });
    globalProgressEl.hidden = !anyLive;
  }

  function renderHoldings() {
    holdingsList.innerHTML = "";
    updateGlobalProgress();
    if (holdings.length === 0) {
      holdingsList.innerHTML = '<div class="holdings-empty">まだ銘柄がありません。上でティッカーと保有株数を入力してください。</div>';
      renderTotals();
      return;
    }
    holdings.forEach(function (h) {
      var item = document.createElement("div");
      item.className = "holding-item";

      var body = '<div class="top-row"><span class="ticker"></span>' +
        '<button type="button" class="del" aria-label="削除">✕</button></div>';

      if (h.error && !h.hasData) {
        body += '<div class="err"></div>';
      } else if (h.loading && !h.hasData) {
        if (h.loadingSource === "live") {
          body += '<div class="loading-label">配当情報を確認しています…</div>' +
            '<div class="progress-track"><div class="bar"></div></div>';
        } else {
          body += '<div class="loading-label">読み込み中…</div>';
        }
      } else if (h.hasData) {
        body += '<div class="monthly"><span class="monthly-val"></span><span class="per"> /月平均（税引前）</span></div>' +
          '<table class="detail">' +
          '<tr><td>保有株数</td><td class="val shares-val"></td></tr>' +
          '<tr><td>現在価格</td><td class="val price-val"></td></tr>' +
          '<tr><td>評価金額</td><td class="val invested-val"></td></tr>' +
          '<tr><td>1株配当金（直近12か月）</td><td class="val dps-val"></td></tr>' +
          '<tr><td>予想年間配当金</td><td class="val annual-val"></td></tr>' +
          '</table>';
        if (h.error) body += '<div class="err"></div>';
      }

      item.innerHTML = body;
      item.querySelector(".ticker").textContent = h.ticker;
      item.querySelector(".del").addEventListener("click", function () {
        holdings = holdings.filter(function (x) { return x.id !== h.id; });
        savePortfolio();
        renderHoldings();
      });

      if (h.hasData) {
        item.querySelector(".monthly-val").textContent = usd(h.annualDividendUSD / 12);
        item.querySelector(".shares-val").textContent = h.shares.toLocaleString("en-US", { maximumFractionDigits: 4 });
        item.querySelector(".price-val").textContent = usd(h.priceUSD);
        item.querySelector(".invested-val").textContent = usd(h.marketValueUSD);
        item.querySelector(".dps-val").textContent = usd(h.dividendPerShareUSD);
        item.querySelector(".annual-val").textContent = usd(h.annualDividendUSD);
      }
      if (h.error) {
        item.querySelector(".err").textContent = "⚠ " + h.error;
      }

      holdingsList.appendChild(item);
    });
    renderTotals();
  }

  function refreshHolding(h) {
    h.loading = true;
    h.loadingSource = null;
    return fetchQuote(h.ticker, function (source) {
      h.loadingSource = source;
      if (source === "live") renderHoldings();
    }).then(function (data) {
      return fxRateToUSD(data.currency).then(function (rate) {
        var priceUSD = data.price * rate;
        var dividendPerShareUSD = data.ttmDividend * rate;
        h.priceUSD = priceUSD;
        h.dividendPerShareUSD = dividendPerShareUSD;
        h.marketValueUSD = priceUSD * h.shares;
        h.annualDividendUSD = dividendPerShareUSD * h.shares;
        h.hasData = true;
        h.error = null;
        h.loading = false;
        h.loadingSource = null;
        savePortfolio();
      });
    }).catch(function (err) {
      h.loading = false;
      h.loadingSource = null;
      h.error = "銘柄情報を取得できませんでした。銘柄コードを確認するか、しばらくしてから再度お試しください。";
    });
  }

  function refreshAll() {
    if (holdings.length === 0) {
      setStatus("idle", "保有銘柄を追加して配当金を確認できます");
      return;
    }
    setStatus("loading", "読み込み中…");
    loadDb(true);
    renderHoldings();
    Promise.all(holdings.map(refreshHolding)).then(function () {
      renderHoldings();
      var anyError = holdings.some(function (h) { return h.error; });
      updatedEl.textContent = "確認時刻 " + new Date().toLocaleTimeString("ja-JP");
      setStatus(anyError ? "error" : "", anyError ? "一部の銘柄の取得に失敗（下記参照）" : "配当金の計算が完了しました");
    });
  }

  function addHolding() {
    var ticker = tickerEl.value.trim().toUpperCase();
    var shares = parseFloat(sharesEl.value);
    if (!ticker) { tickerEl.focus(); return; }
    if (!shares || shares <= 0) { sharesEl.focus(); return; }

    var h = {
      id: Date.now() + "-" + Math.random().toString(36).slice(2, 8),
      ticker: ticker,
      shares: shares,
      hasData: false,
      loading: false,
      error: null
    };
    holdings.push(h);
    savePortfolio();
    tickerEl.value = "";
    sharesEl.value = "";
    renderHoldings();

    setStatus("loading", "読み込み中…");
    refreshHolding(h).then(function () {
      renderHoldings();
      updatedEl.textContent = "確認時刻 " + new Date().toLocaleTimeString("ja-JP");
      setStatus(h.error ? "error" : "", h.error ? "取得失敗（下記参照）" : "配当金の計算が完了しました");
      ensureTimer();
    });
  }

  function ensureTimer() {
    if (timer) return;
    timer = setInterval(refreshAll, REFRESH_MS);
  }

  addBtn.addEventListener("click", addHolding);
  tickerEl.addEventListener("keydown", function (e) { if (e.key === "Enter") sharesEl.focus(); });
  sharesEl.addEventListener("keydown", function (e) { if (e.key === "Enter") addHolding(); });

  clearAllBtn.addEventListener("click", function () {
    if (holdings.length === 0) return;
    if (!confirm("保有銘柄を全て削除しますか？")) return;
    holdings = [];
    savePortfolio();
    renderHoldings();
    setStatus("idle", "保有銘柄を追加して配当金を確認できます");
  });

  // 保存済みポートフォリオを復元 — 直近の計算結果もキャッシュされていれば
  // 再取得を待たずにその値をすぐ表示する。
  var saved = loadPortfolio();
  holdings = saved.map(function (s) {
    return {
      id: s.id,
      ticker: s.ticker,
      shares: s.shares || 0,
      hasData: !!s.hasData,
      priceUSD: s.priceUSD || 0,
      dividendPerShareUSD: s.dividendPerShareUSD || 0,
      marketValueUSD: s.marketValueUSD || 0,
      annualDividendUSD: s.annualDividendUSD || 0,
      loading: false,
      loadingSource: null,
      error: null
    };
  });
  renderHoldings();
  if (holdings.length > 0) {
    refreshAll();
    ensureTimer();
  }
})();
</script>
</body>
